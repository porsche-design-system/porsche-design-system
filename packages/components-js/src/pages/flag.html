<div class="playground" title="default">
  <p-flag></p-flag>
</div>

<div class="playground" title="size=2xs, xs, sm, md, lg, xl, 2xl, 3xl, 4xl, 5xl, inherit">
  <p-flag size="2xs"></p-flag>
  <p-flag size="xs"></p-flag>
  <p-flag size="sm"></p-flag>
  <p-flag size="md"></p-flag>
  <p-flag size="lg"></p-flag>
  <p-flag size="xl"></p-flag>
  <p-flag size="2xl"></p-flag>
  <p-flag size="3xl"></p-flag>
  <p-flag size="4xl"></p-flag>
  <p-flag size="5xl"></p-flag>
  <p-flag
    class="a11ytree-snapshot-test"
    size="inherit"
    style="font-size: 99px"
    aria="{ 'aria-label': 'German flag' }"
  ></p-flag>
</div>

<div class="playground" title="size={ base: '2xs', xs: 'xs', s: 'sm', m: 'md', l: 'lg', xl: 'xl' }">
  <p-flag size="{ base: '2xs', xs: 'xs', s: 'sm', m: 'md', l: 'lg', xl: 'xl' }"></p-flag>
</div>

<div class="playground" title="--p-flag-size: 99px">
  <p-flag class="custom-size"></p-flag>
</div>

<div class="playground overview" title="overview">
  <script>
    const markup = FLAG_NAMES.map(
      (name) =>
        `<p-flag name="${name}" size="inherit" color="inherit" aria="{ 'aria-label': '${name} flag' }"></p-flag>`
    ).join('');
    document.querySelector('.overview').innerHTML = markup;
  </script>
</div>
