<p-button type="button" aria="{ 'aria-haspopup': 'dialog' }">Open Flyout</p-button>

<p-text id="dismiss-reason">Last dismissed via: not dismissed yet</p-text>

<p-flyout open="false" aria="{ 'aria-label': 'Some Heading' }">
  <p-heading slot="header" size="large" tag="h2">Some Heading</p-heading>
  <p-text>Some Content</p-text>
  <p-button-group slot="footer">
    <p-button type="button">Proceed</p-button>
    <p-button type="button" variant="secondary">Cancel</p-button>
  </p-button-group>
  <p-text slot="sub-footer">Some additional Sub-Footer</p-text>
</p-flyout>

<script>
  const flyout = document.querySelector('p-flyout');
  const dismissReason = document.querySelector('#dismiss-reason');
  flyout.addEventListener('dismiss', (e) => {
    dismissReason.innerText = `Last dismissed via: ${e.detail.reason}`;
    flyout.open = false;
  });
  document.querySelector('p-button').addEventListener('click', () => (flyout.open = true));
</script>
