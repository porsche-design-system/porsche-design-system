# Weekly npm dependency-bump — turbo-spec workflow blueprint.
#
# A turbo-spec-native evolution of .github/workflows/weekly-dependency-agent.yml.
# The deterministic dependency work (install, build, syncpack bump, verify) is
# expressed as `kind: script` nodes; the PR
# LIFECYCLE itself is owned by the engine's `--create-pr` (draft PR opened up
# front, per-stage auto-commit + push, marked ready on success / kept draft on
# failure) — a `kind: script` node cannot and must not hand-roll `gh` because the
# executor scrubs write-capable GitHub tokens from script steps by design. Only
# the genuinely judgement-requiring step — resolving the ROOT CAUSE of an
# `npm install` failure (peer/ERESOLVE conflicts → add or prune root `overrides`,
# per docs/runbooks/dependency-updates-agent.md steps 6-7) — stays an LLM agent,
# and its retries are driven by a `script_gate` quality gate rather than by a
# hand-built routing loop.
# This is a PROPOSAL alongside the existing Actions dispatcher, not a replacement.
#
# NOTE — deliberate narrowing of the original flowchart: the exhausted path opens a
# DRAFT PR only; it does NOT file a separate manual-resolution issue. Issue
# creation cannot work here (`--create-issue` is mutually exclusive with
# `--create-pr`, and a script step has no write token), and the draft PR alone
# signals "needs manual resolution". Notifying on a non-zero engine exit belongs to
# the thin GitHub Actions cron that schedules the run, not to the pipeline.
#
# ENGINE PREREQUISITE: requires turbo-spec with PR #1398 (deterministic-script-node)
# merged — it ships `kind: script` and `outcome:`. It will NOT load on the current
# turbo-spec release.
#
# Schema: <turbo-spec>/src/workflow_skeleton/_builtin/workflows/schema.json
name: dependency-bump
version: "1.0"
description: >
  Deterministic-first weekly npm dependency bump. Installs a clean baseline,
  builds, bumps non-held-back versions with syncpack, then verifies the install —
  handing a failure to an agent whose quality gate re-runs the real install and
  retries it up to three times — before the engine's --create-pr lifecycle
  publishes the result: the PR is
  marked ready (green) or kept as a draft on any run failure (budget exhausted, or an
  inconsistent bump caught by verify_bump).

# There is no `schedule` trigger type in turbo-spec (TriggerType is
# issue|cli|slack|webhook). The weekly "every Monday morning" cadence is driven by
# a thin GitHub Actions cron that invokes the engine — exactly as the existing
# weekly-dependency-agent.yml cron dispatches today. `cli` is the functional
# trigger the cron calls.
triggers:
  - type: cli
    command: dependency-bump

context:
  required:
    - repository
  optional:
    - branch_name

stages:
  # 1. Clean baseline install. A broken baseline is not "data" to branch on — it
  #    means the checkout itself is unusable, so hard-fail the run.
  #    `timeout:` is a real constraint, not cargo cult: a `kind: script` step with
  #    no override inherits the engine's 300s default and is SIGKILLed on expiry
  #    (proven at the build stage below). A cold-cache install of ~400 deps can
  #    exceed 300s — our 19s baseline pass only happened because the npm cache was
  #    warm — so give it generous headroom to avoid a spurious abort.
  - name: install_baseline
    kind: script
    on_error: abort
    timeout: "20m"
    steps:
      - name: install
        command: ["npm", "run", "npm:install"]

  # 2. Full build against the current baseline (proves the tree is green BEFORE we
  #    touch any versions). Slow on this monorepo; hard-fail if it breaks.
  #    `timeout: "45m"` is required, not guessed: a real run of this exact blueprint
  #    SIGKILLed the build at exactly the engine's 300s `kind: script` default
  #    (still mid-build, exit -9), aborting the run before any terminal. A later
  #    real run let it complete: the full PDS build (core-deps -> components -> js
  #    -> angular/react/vue -> storefront) took 5m37s — just past the 300s default —
  #    so 45m gives comfortable cold-machine headroom. `on_error: abort` stays — a
  #    broken baseline build SHOULD hard-fail.
  - name: build
    kind: script
    depends_on: [install_baseline]
    on_error: abort
    timeout: "45m"
    steps:
      - name: build
        command: ["npm", "run", "build"]

  # 3. Bump non-held-back versions with syncpack, non-interactively. `npm:update`
  #    is `--interactive` and would hang in automation; `npm:update:ci` is its
  #    non-interactive sibling (added in this PR). `.syncpackrc.json` already
  #    excludes the held-back deps (@porsche-design-system/**, @playwright/test,
  #    @stencil/core), so this only moves what the weekly bump is allowed to move.
  #    `timeout: "5m"` is REQUIRED and measured: the real command ran in ~25s, and
  #    the engine's old 300s hardcoded default never bit it. Since script-step
  #    timeout now resolves to `stage.timeout or settings.timeout_per_stage or 300s`
  #    (executor/in_process.py), WITHOUT this line the ceiling would silently be the
  #    60m global — a 25s command hanging for an hour before being killed. 5m keeps
  #    the fail-fast intent with ~12x headroom over the measured time.
  - name: bump_versions
    kind: script
    depends_on: [build]
    on_error: abort
    timeout: "5m"
    steps:
      - name: syncpack-update
        command: ["npm", "run", "npm:update:ci"]

  # 4. Try to install the updated versions — a cheap (~14s) deterministic PROBE.
  #    A failed install is DATA here (on_error: continue), not an abort: its
  #    `success` is what the agent's `condition` reads. This node is load-bearing
  #    for COST, not just correctness — it is the only thing keeping the agent (and
  #    its gate) off the green path. A condition-false stage is skipped before it
  #    executes, so on a clean weekly bump the agent never runs and the run costs
  #    zero model tokens. With the syncpack minor-cap in place, green is the
  #    EXPECTED weekly outcome, so that matters every week.
  #    Same 300s-default caveat as install_baseline: without an explicit `timeout:`
  #    a cold-cache install here would be SIGKILLed at 300s, so it carries a
  #    generous override too.
  - name: try_install
    kind: script
    depends_on: [bump_versions]
    on_error: continue
    timeout: "20m"
    steps:
      - name: install-updated
        command: ["npm", "run", "npm:install"]

  # 5. THE ONE AGENT, and the only retry loop. Runs only when the probe above
  #    failed; skipped entirely on a clean bump. Its job: diagnose the ROOT CAUSE
  #    (peer/ERESOLVE conflict) and fix it the correct way — a pinned root
  #    `overrides` entry, or pruning a now-stale one — never --force /
  #    --legacy-peer-deps / hand-edited versions.
  #
  #    The retry budget lives in the quality gate, not in the condition: the gate
  #    re-runs the real install after the agent's turn and loops back — re-running
  #    THIS agent, with up to 4000 chars of the install output folded into its
  #    feedback — while the budget lasts. script_gate maps exit codes to verdicts:
  #    0 passes, 1 (npm's ERESOLVE/peer failure) is a genuine failure that loops
  #    back, >=2 escalates rather than hard-failing. Omitting `loop_back:` targets
  #    the current stage, so the retry re-runs this agent and nothing earlier.
  #
  #    `max_retries: 2` = 1 initial + 2 retries = exactly THREE agent turns, each
  #    followed by a real `npm run npm:install`. This is the flowchart's "attempts
  #    < 3" expressed once. An earlier revision ran this gate INSIDE a `kind:
  #    decision` backward loop, which multiplied the two budgets (up to 6 turns)
  #    and installed twice per turn; a single loop removes both problems.
  #
  #    ESCALATION NEEDS NO STAGE. When the budget is spent the engine logs "Retry
  #    budget exhausted", sets `aborting`, and — with no terminal report stage —
  #    ends the run. The run FAILS, so the engine's --create-pr lifecycle calls
  #    finalize_pr(success=False) and KEEPS THE PR AS A DRAFT: exactly the
  #    flowchart's "open draft PR for manual resolution". The gate's failure output
  #    is preserved in the trace (reason + full output in GateResult.details).
  #
  #    KNOWN CEILING: script_gate calls run_step with timeout=None, so this step is
  #    UNBOUNDED — there is no timeout knob on a gate step (unlike a kind: script
  #    stage, which now always carries an explicit measured `timeout:`). A wedged
  #    npm install here would hang indefinitely rather than being killed. Accepted
  #    because npm install terminates on its own in practice; revisit if the engine
  #    grows a per-gate-step timeout.
  - name: resolve_install_failure
    orchestrator: implementation
    depends_on: [try_install]
    condition: "not try_install.success"
    system_prompt: implementer
    agents:
      - type: implementer
        tools: [file, shell, github]
    quality_gates:
      - evaluator: script_gate
        on_fail: loop_back
        max_retries: 2
        config:
          steps:
            - name: verify-install
              command: ["npm", "run", "npm:install"]

  # 6. Success terminal. The engine's `--create-pr` lifecycle already owns every
  #    git/gh mechanic: it opened the draft PR up front, auto-commits + pushes the
  #    worktree after EVERY stage (so the syncpack bump and any agent fix are
  #    already on the PR branch), and on run success marks the PR READY for review.
  #    A `kind: script` step is DENIED write-capable GitHub credentials by design
  #    (the executor scrubs GITHUB_TOKEN because npm scripts run arbitrary
  #    dependency code) and its command is never templated — so a terminal cannot,
  #    and must not, hand-roll `gh pr create`. Because the engine opens the PR, this
  #    stage instead VERIFIES the bump: `npm run npm:lint` (syncpack lint) asserts
  #    dependency versions are CONSISTENT across all workspaces after the bump — a
  #    different, non-redundant question from `try_install` (a monorepo can install
  #    cleanly yet be internally inconsistent). It honours `.syncpackrc.json`, so the
  #    excluded / minor-capped families are not reported. On a consistent tree it
  #    exits 0, the stage succeeds, the run succeeds, and `outcomes.final` reads
  #    `pr_opened` — the engine marks the PR READY.
  #    `on_error: abort` is LOAD-BEARING (not defensive): it gives the gate teeth so
  #    the conservative guarantee below actually holds.
  #    CONSERVATIVE-OUTCOME GUARANTEE: if the agent pins a dependency back in the root
  #    manifest but not in every workspace declaring it, syncpack lint fails, the stage
  #    aborts, the run fails, and the engine KEEPS the PR DRAFT — an agent-repaired-but-
  #    inconsistent bump lands as a draft. `pr_opened` is then recorded in
  #    `outcomes.reached` with success=false and is (correctly) NOT the final outcome.
  #    That is the correct conservative result (documented in the PR body and
  #    .turbo-spec/README.md). Under `on_error: continue` a failing lint would be treated
  #    as data, the run would succeed, and the PR would be marked ready anyway — silently
  #    breaking that guarantee — which is exactly why this must be `abort`.
  #    This is the ONLY terminal: the failure path needs no stage, because an exhausted
  #    gate budget ends the run and the engine keeps the PR draft on its own.
  - name: verify_bump
    kind: script
    depends_on: [resolve_install_failure]
    on_error: abort
    # `npm:lint` (syncpack lint) is a seconds-long check; `timeout: "5m"` keeps it
    # in the same measured-fail-fast class as bump_versions rather than silently
    # inheriting the 60m global (see the settings note below).
    timeout: "5m"
    outcome: pr_opened
    steps:
      - name: verify-consistency
        command: ["npm", "run", "npm:lint"]

model_provider:
  primary: copilot
  config:
    model_id: claude-sonnet-5

settings:
  # Cross-stage gate-retry ceiling. The agent's own budget is the gate's
  # `max_retries: 2` (3 turns); this is the unrelated run-scoped cap above it.
  max_total_retries: 6
  # Pure backstop, NOT a live bound. Two facts fixed its role:
  #   - It reaches ONLY script stages without an explicit `timeout:`; every script
  #     stage above now sets one, so at present it governs nothing.
  #   - It does NOT govern the agent — agent turns use the engine's separate
  #     WORKER_TIMEOUT_SECONDS (3600s, env TURBO_SPEC_WORKER_TIMEOUT). An agent stage
  #     MAY declare `timeout:` (it validates), but nothing consumes it: the resolver
  #     that would apply it, WorkflowRunner._resolve_timeout, has no production caller,
  #     so both `stage.timeout` and this setting are inert on agent stages.
  # It also cannot be dropped to restore the engine's 300s fail-fast default: the
  # schema defaults this key to 50m, so omitting it just yields 50m. Kept at 60m as
  # an explicit, generous latent backstop for any future un-timeout'd script stage —
  # the owner's accepted pattern is generous global + tight measured per-stage overrides.
  timeout_per_stage: "60m"
  human_escalation: true
