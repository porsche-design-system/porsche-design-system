# Weekly npm dependency-bump — turbo-spec workflow blueprint.
#
# A turbo-spec-native evolution of .github/workflows/weekly-dependency-agent.yml.
# The deterministic dependency work (install, build, syncpack bump, retry-install,
# routing) is expressed as `kind: script` and `kind: decision` nodes; the PR
# LIFECYCLE itself is owned by the engine's `--create-pr` (draft PR opened up
# front, per-stage auto-commit + push, marked ready on success / kept draft on
# failure) — a `kind: script` node cannot and must not hand-roll `gh` because the
# executor scrubs write-capable GitHub tokens from script steps by design. Only
# the genuinely judgement-requiring step — resolving the ROOT CAUSE of an
# `npm install` failure (peer/ERESOLVE conflicts → add or prune root `overrides`,
# per docs/runbooks/dependency-updates-agent.md steps 6-7) — stays an LLM agent.
# This is a PROPOSAL alongside the existing Actions dispatcher, not a replacement.
#
# NOTE — deliberate narrowing of the original flowchart: the exhausted path opens a
# DRAFT PR only; it does NOT file a separate manual-resolution issue. Issue
# creation cannot work here (`--create-issue` is mutually exclusive with
# `--create-pr`, and a script step has no write token), and the draft PR alone
# signals "needs manual resolution". Notifying on a non-zero engine exit belongs to
# the thin GitHub Actions cron that schedules the run, not to the pipeline.
#
# ENGINE PREREQUISITE: requires turbo-spec with PR #1398 (deterministic-script-node)
# merged — it ships `kind: script`, `kind: decision`, backward routing and
# `outcome:`. It will NOT load on the current turbo-spec release.
#
# Schema: <turbo-spec>/src/workflow_skeleton/_builtin/workflows/schema.json
name: weekly-dependency-bump
version: "1.0"
description: >
  Deterministic-first weekly npm dependency bump. Installs a clean baseline,
  builds, bumps non-held-back versions with syncpack, then retries the install up
  to three times — handing each failure to an agent that fixes the root cause —
  before the engine's --create-pr lifecycle publishes the result: the PR is marked
  ready (green) or kept as a draft for manual resolution (budget exhausted).

# There is no `schedule` trigger type in turbo-spec (TriggerType is
# issue|cli|slack|webhook). The weekly "every Monday morning" cadence is driven by
# a thin GitHub Actions cron that invokes the engine — exactly as the existing
# weekly-dependency-agent.yml cron dispatches today. `cli` is the functional
# trigger the cron calls.
triggers:
  - type: cli
    command: weekly-dependency-bump

context:
  required:
    - repository
  optional:
    - branch_name

stages:
  # 1. Clean baseline install. A broken baseline is not "data" to branch on — it
  #    means the checkout itself is unusable, so hard-fail the run.
  #    `timeout:` is a real constraint, not cargo cult: a `kind: script` step with
  #    no override inherits the engine's 300s default and is SIGKILLed on expiry
  #    (proven at the build stage below). A cold-cache install of ~400 deps can
  #    exceed 300s — our 19s baseline pass only happened because the npm cache was
  #    warm — so give it generous headroom to avoid a spurious abort.
  - name: install_baseline
    kind: script
    on_error: abort
    timeout: "20m"
    steps:
      - name: install
        command: ["npm", "run", "npm:install"]

  # 2. Full build against the current baseline (proves the tree is green BEFORE we
  #    touch any versions). Slow on this monorepo; hard-fail if it breaks.
  #    `timeout: "45m"` is required, not guessed: a real run of this exact blueprint
  #    SIGKILLed the build at exactly the engine's 300s `kind: script` default
  #    (still mid-build, exit -9), aborting the run before any terminal. A later
  #    real run let it complete: the full PDS build (core-deps -> components -> js
  #    -> angular/react/vue -> storefront) took 5m37s — just past the 300s default —
  #    so 45m gives comfortable cold-machine headroom. `on_error: abort` stays — a
  #    broken baseline build SHOULD hard-fail.
  - name: build
    kind: script
    depends_on: [install_baseline]
    on_error: abort
    timeout: "45m"
    steps:
      - name: build
        command: ["npm", "run", "build"]

  # 3. Bump non-held-back versions with syncpack, non-interactively. `npm:update`
  #    is `--interactive` and would hang in automation; `npm:update:ci` is its
  #    non-interactive sibling (added in this PR). `.syncpackrc.json` already
  #    excludes the held-back deps (@porsche-design-system/**, @playwright/test,
  #    @stencil/core), so this only moves what the weekly bump is allowed to move.
  - name: bump_versions
    kind: script
    depends_on: [build]
    on_error: abort
    steps:
      - name: syncpack-update
        command: ["npm", "run", "npm:update:ci"]

  # 4. Try to install the updated versions. THIS is the node the retry loop
  #    re-enters, so its 1-based `attempts` counter drives the budget. A failed
  #    install is DATA here (on_error: continue), not an abort — the decision
  #    downstream branches on `try_install.success` / `try_install.attempts`.
  #    Same 300s-default caveat as install_baseline: without an explicit `timeout:`
  #    a cold-cache install here would be SIGKILLed at 300s, turning the retry loop
  #    into a nasty intermittent failure — so it carries a generous override too.
  - name: try_install
    kind: script
    depends_on: [bump_versions]
    on_error: continue
    timeout: "20m"
    steps:
      - name: install-updated
        command: ["npm", "run", "npm:install"]

  # 5. THE ONE AGENT. Only runs when the install failed AND retry budget remains
  #    (attempts 1 and 2); skipped on success and on the spent 3rd attempt. It
  #    sits between try_install and the decision, so a backward route re-runs
  #    try_install + this agent — i.e. "agent fixes, then install is retried".
  #    Its job: diagnose the ROOT CAUSE (peer/ERESOLVE conflict) and fix it the
  #    correct way — a pinned root `overrides` entry, or pruning a now-stale one —
  #    never --force / --legacy-peer-deps / hand-edited versions.
  - name: resolve_install_failure
    orchestrator: implementation
    depends_on: [try_install]
    condition: "not try_install.success and try_install.attempts < 3"
    system_prompt: implementer
    agents:
      - type: implementer
        tools: [file, shell, github]

  # 6. Pure router. First-match-wins:
  #      success            -> verify_bump             (forward)
  #      attempts < 3        -> try_install            (BACKWARD -> retry loop body)
  #      otherwise (default) -> needs_manual_resolution (forward)
  #    Forward targets MUST depend_on this decision (else their edge flips backward
  #    and exclusivity goes inert). The backward target (try_install) MUST NOT.
  - name: route_install
    kind: decision
    depends_on: [resolve_install_failure]
    when:
      - condition: "try_install.success"
        goto: verify_bump
      - condition: "try_install.attempts < 3"
        goto: try_install
    default:
      goto: needs_manual_resolution

  # 7. Success terminal. The engine's `--create-pr` lifecycle already owns every
  #    git/gh mechanic: it opened the draft PR up front, auto-commits + pushes the
  #    worktree after EVERY stage (so the syncpack bump and any agent fix are
  #    already on the PR branch), and on run success marks the PR READY for review.
  #    A `kind: script` step is DENIED write-capable GitHub credentials by design
  #    (the executor scrubs GITHUB_TOKEN because npm scripts run arbitrary
  #    dependency code) and its command is never templated — so a terminal cannot,
  #    and must not, hand-roll `gh pr create`. Because the engine opens the PR, this
  #    stage instead VERIFIES the bump: `npm run npm:lint` (syncpack lint) asserts
  #    dependency versions are CONSISTENT across all workspaces after the bump — a
  #    different, non-redundant question from `try_install` (a monorepo can install
  #    cleanly yet be internally inconsistent). It honours `.syncpackrc.json`, so the
  #    excluded / minor-capped families are not reported. It exits 0 on a consistent
  #    tree, so the success terminal records `outcome: pr_opened` and `outcomes.final`
  #    reads `pr_opened`. `on_error: continue` is retained defensively.
  #    CONSERVATIVE-OUTCOME NOTE: if the agent pins a dependency back in the root
  #    manifest but not in every workspace declaring it, syncpack lint fails, the run
  #    fails, and the engine keeps the PR DRAFT — an agent-repaired-but-inconsistent
  #    bump lands as a draft. That is the correct conservative result (documented in
  #    the PR body and .turbo-spec/README.md).
  - name: verify_bump
    kind: script
    depends_on: [route_install]
    on_error: continue
    outcome: pr_opened
    steps:
      - name: verify-consistency
        command: ["npm", "run", "npm:lint"]

  # 8. Exhausted terminal. Budget spent (3 attempts) and the install is still red.
  #    Like verify_bump, the engine owns the PR: `--create-pr` KEEPS the PR as a DRAFT
  #    when the run fails (finalize_pr(success=False)) — exactly the flowchart's
  #    "open draft PR". So this node opens no PR and files no issue (a script step
  #    has no write token; issue creation is dropped by decision — see the header
  #    note, the PR body and .turbo-spec/README.md). Instead it runs the real,
  #    still-failing `npm run npm:install` under `on_error: abort`: the deps are
  #    genuinely broken, so this fails for real, the run fails, the engine keeps the
  #    PR draft, and the real ERESOLVE/peer output lands in the trace and PR summary
  #    for the human doing manual resolution. The real failing command (not `false`)
  #    is deliberate — it demonstrates the failure with real evidence.
  #    NOTE: `outcome: draft_filed` is tagged on a stage that then aborts, so it
  #    appears in `outcomes.reached` with success=false and is (correctly) NOT the
  #    final outcome — `final` only picks the last SUCCESSFUL outcome.
  - name: needs_manual_resolution
    kind: script
    depends_on: [route_install]
    on_error: abort
    outcome: draft_filed
    steps:
      - name: reinstall-still-broken
        command: ["npm", "run", "npm:install"]

model_provider:
  primary: copilot
  config:
    model_id: claude-sonnet-5

settings:
  # Backward loop is bounded by the decision guard (attempts < 3); this is the
  # unrelated cross-stage gate-retry ceiling.
  max_total_retries: 6
  # Generous per-stage bound: the full monorepo build and installs are slow.
  timeout_per_stage: "60m"
  human_escalation: true
