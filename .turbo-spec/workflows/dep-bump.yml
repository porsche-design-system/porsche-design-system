name: dep-bump
version: "1.0"
description: >-
  Minimal TurboSpec onboarding blueprint. `npm install` runs once as the global
  setup command (environment preparation, not a quality gate). A single agentless
  stage then collects the outdated third-party npm dependencies into a
  schema-validated structured artifact and renders that artifact as a Markdown
  table inside a report comment on the PR. Everything is deterministic — there
  are no agentic stages.

# `npm install` prepares the tree once before any stage runs. It is deliberately
# NOT a stage: there is no acceptance gate here, only environment setup. A
# non-zero exit aborts the pipeline before the first stage.
setup_command: "npm install"
setup_command_timeout: "20m"

# Empty list = the default gh-aw + Porsche ecosystem domain allow-list (npm
# registries included) applies. Add EXTRA literal hosts here only if the
# sandbox log prints "[sandbox] egress denied" for a host a step needs.
network:
  allowed: []

stages:
  # check_outdated_dependencies — agentless, deterministic. One acceptance check:
  # the outdated packages, collected into .turbo-spec/out/outdated.json, must
  # satisfy outdated.schema.json.
  #
  #   1. gate.pre_command  → collect-outdated.sh produces the structured artifact
  #      (hard-aborts on a genuine npm failure instead of authoring a false list).
  #   2. outcome_contract  → validates that artifact against the schema. This is
  #      the ONLY real gate; collection is merely its input preparation.
  #   3. stage.post_command → report-comment.sh renders the artifact as a Markdown
  #      table and upserts the PR comment. It is a side effect that runs AFTER the
  #      result is accepted, not an acceptance check of its own.
  - name: check_outdated_dependencies
    orchestrator: testing
    outputs:
      outdated: .turbo-spec/out/outdated.json
    # Report is a side effect, not a gate — it runs once the artifact is accepted.
    post_command: "bash .turbo-spec/scripts/report-comment.sh"
    hook_timeout: "5m"
    quality_gates:
      - evaluator: outcome_contract
        on_fail: escalate
        # A schema mismatch is a deterministic defect; retrying would only
        # re-run the pre_command and RE-COLLECT a fresh npm snapshot rather than
        # re-validate the same one, so there is nothing to gain from a retry.
        max_retries: 0
        # Produce the artifact the evaluator is about to inspect.
        pre_command: "bash .turbo-spec/scripts/collect-outdated.sh"
        hook_timeout: "10m"
        config:
          outcome_path: .turbo-spec/out/outdated.json
          schema: .turbo-spec/schemas/outdated.schema.json

model_provider:
  primary: copilot
  config:
    model_id: claude-sonnet-5

settings:
  max_total_retries: 2
  timeout_per_stage: "20m"
  human_escalation: true
