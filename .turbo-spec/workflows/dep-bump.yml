name: dep-bump
version: "1.0"
description: >-
  Minimal TurboSpec onboarding blueprint: one deterministic, agentless stage.
  `npm ci` prepares the tree once, then the stage collects the outdated
  third-party npm dependencies into a structured artifact, validates it against
  outdated.schema.json via the built-in outcome_contract gate, and renders it as
  a Markdown table in a PR comment. There are no agentic stages.

# `npm ci` prepares the tree once before any stage runs — a clean, deterministic
# install that matches package-lock.json and never mutates the lockfile. It is
# environment setup, not a stage/gate; a non-zero exit aborts the pipeline before
# the first stage. The 20m timeout overrides the 5m default for this monorepo.
setup_command: "npm ci"
setup_command_timeout: "20m"

stages:
  # check_outdated_dependencies — agentless, deterministic:
  #   1. gate.pre_command  → collect-outdated.sh produces the structured artifact
  #      (hard-aborts on a genuine npm failure instead of authoring a false list).
  #   2. outcome_contract  → the built-in gate validates that artifact against the
  #      schema. This is the only acceptance check.
  #   3. stage.post_command → report-comment.sh renders the artifact as a Markdown
  #      table and upserts the PR comment, after the artifact is accepted.
  - name: check_outdated_dependencies
    orchestrator: testing
    outputs:
      outdated: .turbo-spec/out/outdated.json
    post_command: "bash .turbo-spec/scripts/report-comment.sh"
    quality_gates:
      - evaluator: outcome_contract
        on_fail: escalate
        pre_command: "bash .turbo-spec/scripts/collect-outdated.sh"
        hook_timeout: "10m"
        config:
          outcome_path: .turbo-spec/out/outdated.json
          schema: .turbo-spec/schemas/outdated.schema.json
