name: dep-bump
version: "1.0"
description: >-
  Minimal TurboSpec onboarding blueprint. Runs a single deterministic quality
  gate (`npm install`) and then a report stage that lists outdated third-party
  npm dependencies and posts them as a Markdown table in a PR comment. No
  agentic stages — everything here is agentless and reproducible.

# Empty list = the default gh-aw + Porsche ecosystem domain allow-list (npm
# registries included) applies. Add EXTRA literal hosts here only if the
# sandbox log prints "[sandbox] egress denied" for a host a step needs.
network:
  allowed: []

stages:
  # S1 Install — agentless. The single quality gate: a clean `npm install` must
  # succeed. Any failure escalates (there is no agent to fix it).
  - name: install
    orchestrator: testing
    quality_gates:
      - evaluator: script_gate
        on_fail: escalate
        max_retries: 1
        config:
          gate_name: install
          failure_verdict: escalate
          environment_verdict: escalate
          success_reason: "npm install completed successfully"
          steps:
            - name: install
              command: ["npm", "install"]

  # S2 Report — agentless. Deterministic: list outdated dependencies and upsert
  # them as a single Markdown table in a PR comment. The script is best-effort
  # and always exits 0, so the report never fails the run.
  - name: report
    orchestrator: testing
    depends_on: [install]
    quality_gates:
      - evaluator: script_gate
        on_fail: escalate
        max_retries: 1
        config:
          gate_name: report
          failure_verdict: escalate
          environment_verdict: escalate
          success_reason: "Outdated-dependency table posted to the PR"
          steps:
            - name: outdated-report
              command: ["bash", ".turbo-spec/scripts/outdated-report.sh"]

model_provider:
  primary: copilot
  config:
    model_id: claude-sonnet-5

settings:
  max_total_retries: 2
  timeout_per_stage: "20m"
  human_escalation: true
