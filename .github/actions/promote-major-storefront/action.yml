name: 'Promote Major Storefront'
description: 'Rebuilds the latest stable release for its major URL. Caller must hold the per-major concurrency lock and assume the storefront release role.'

inputs:
  bucket:
    description: 'Storefront origin bucket.'
    required: true
  distribution-id:
    description: 'Storefront CloudFront distribution.'
    required: true

outputs:
  promoted:
    description: 'Whether the major URL was updated.'
    value: ${{ steps.resolve.outputs.promote }}

runs:
  using: 'composite'
  steps:
    - name: 'Resolve promotion'
      id: resolve
      shell: bash
      run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON "$GITHUB_ACTION_PATH/../../../scripts/storefront-release.ts" promotion
    - name: 'Build major storefront'
      if: steps.resolve.outputs.promote == 'true'
      shell: bash
      run: npm run build:storefront
      env:
        NEXT_PUBLIC_BASE_PATH: ${{ steps.resolve.outputs.slug }}
    - name: 'Deploy major storefront'
      if: steps.resolve.outputs.promote == 'true'
      uses: ./.github/actions/s3-deploy
      with:
        source: ./packages/storefront/dist
        slug: ${{ steps.resolve.outputs.slug }}
        bucket: ${{ inputs.bucket }}
        distribution-id: ${{ inputs.distribution-id }}
        delete: 'true'
        algolia: 'true'
        wait-for-invalidation: 'true'
