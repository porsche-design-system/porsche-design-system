name: 'Create GitHub Release'
description: 'Idempotently creates a GitHub Release (vX.Y.Z) for a stable version, merging all related pre-release changelog entries into the release body.'

inputs:
  version:
    description: 'Package version (without leading "v"). The release tag/name will be "v${version}". Pre-release versions (containing "-rc"/"-beta"/"-alpha") are skipped.'
    required: true
  github-token:
    description: 'GitHub token with "contents: write" permission.'
    required: true
  repository:
    description: 'Target repository in "owner/name" form. Defaults to github.repository.'
    required: false
    default: ${{ github.repository }}
  changelog-path:
    description: 'Path to the changelog file used to extract the release body.'
    required: false
    default: 'packages/components/CHANGELOG.md'

runs:
  using: 'composite'
  steps:
    - name: 'Create GitHub Release'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_CHANGELOG_PATH: ${{ inputs.changelog-path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ${{ github.action_path }}/create-github-release.sh

