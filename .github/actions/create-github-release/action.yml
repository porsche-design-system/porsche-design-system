name: 'Create GitHub Release'
description: 'Idempotently creates a GitHub Release (vX.Y.Z) for a stable version, automatically creating the underlying git tag at the given commit. Pre-release versions are skipped.'

inputs:
  version:
    description: 'Package version (without leading "v"). The release tag/name will be "v${version}". Pre-release versions (containing "-rc"/"-beta"/"-alpha") are skipped.'
    required: true
  github-token:
    description: 'GitHub token with "contents: write" permission.'
    required: true
  sha:
    description: 'Commit SHA the release (and its tag) should point at. Defaults to github.sha.'
    required: false
    default: ${{ github.sha }}
  repository:
    description: 'Target repository in "owner/name" form. Defaults to github.repository.'
    required: false
    default: ${{ github.repository }}
  changelog-path:
    description: 'Path to the changelog file used to extract the release body.'
    required: false
    default: 'packages/components/CHANGELOG.md'
  make-latest:
    description: 'Whether the release is marked as "Latest": "true", "false" or "auto" (only if it is the highest stable version in the changelog, so maintenance releases of older majors don''t steal the badge).'
    required: false
    default: 'auto'
  draft:
    description: 'Create the release as a draft ("true"/"false"). Drafts don''t create the underlying git tag.'
    required: false
    default: 'false'

outputs:
  created:
    description: 'Whether a release was actually created ("true"/"false"). False for a pre-release version, for a tag that already had a release, and for a dry run — all of which exit 0, so the step succeeding is not the same as a release existing.'
    value: ${{ steps.create_github_release.outputs.created }}

runs:
  using: 'composite'
  steps:
    - name: 'Create GitHub Release'
      id: create_github_release
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_CHANGELOG_PATH: ${{ inputs.changelog-path }}
        INPUT_MAKE_LATEST: ${{ inputs.make-latest }}
        INPUT_DRAFT: ${{ inputs.draft }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ${{ github.action_path }}/create-github-release.sh

