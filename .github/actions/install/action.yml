name: 'Install'

inputs:
  node-version:
    description: 'Node.js version to use.'
    required: false
    default: '24'
  registry-url:
    description: 'npm registry URL (needed for publishing).'
    required: false
    default: ''
  node_modules:
    description: 'Whether to install node_modules or not.'
    required: false
    default: 'true'
  rclone:
    description: 'Whether to install rclone or not.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: 'Setup Node.js'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
    - name: 'Cache node_modules'
      if: inputs.node_modules == 'true'
      uses: actions/cache@v5
      id: cache-node_modules
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-v2-${{ hashFiles('**/package-lock.json') }}
    - name: 'Install node_modules'
      if: inputs.node_modules == 'true' && steps.cache-node_modules.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
    - name: 'Install rclone'
      if: inputs.rclone == 'true'
      run: |
        sudo apt-get -yq update
        sudo apt-get -yq --no-install-suggests --no-install-recommends install rclone
      shell: bash
