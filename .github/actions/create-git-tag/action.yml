name: 'Create Git Tag'
description: 'Idempotently creates a lightweight git tag (vX.Y.Z) on the current commit via the GitHub REST API.'

inputs:
  version:
    description: 'Package version (without leading "v"). The created tag will be "v${version}".'
    required: true
  github-token:
    description: 'GitHub token with "contents: write" permission.'
    required: true
  sha:
    description: 'Commit SHA the tag should point at. Defaults to github.sha.'
    required: false
    default: ${{ github.sha }}
  repository:
    description: 'Target repository in "owner/name" form. Defaults to github.repository.'
    required: false
    default: ${{ github.repository }}
  skip-prereleases:
    description: 'When "true" (default), skip creating a tag for pre-release versions (containing "-rc"/"-beta"/"-alpha").'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: 'Create Git Tag'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_SKIP_PRERELEASES: ${{ inputs.skip-prereleases }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ${{ github.action_path }}/create-git-tag.sh

