name: 'Figma Code Connect Publish'
description: 'Publishes the generated Code Connect templates when what publish would upload changed since the last publish, or that publish was partial, and records this publish in the actions cache. Fails when the parse or the publish failed, once the record is saved.'

inputs:
  figma-access-token:
    description: 'Figma token that publishes the Code Connect records.'
    required: true
  force:
    description: 'Publish even when nothing changed since the last publish.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Exactly what publish uploads: each label's parse output minus the checkout path, sorted as glob order varies.
    - name: 'Hash what publish would upload'
      id: hash
      continue-on-error: true
      shell: bash
      working-directory: packages/components/projects/figma-code-connect
      run: |
        mkdir -p "$RUNNER_TEMP/current"
        for config in figma*.config.json; do
          npx figma connect parse --config "$config" --exit-on-unreadable-files --skip-update-check | jq -cS '.[] | del(._codeConnectFilePath, ._batchTemplateFilePath)'
        done | LC_ALL=C sort > "$RUNNER_TEMP/current/parse.jsonl"
        hash=$(sha256sum < "$RUNNER_TEMP/current/parse.jsonl" | cut -c1-64)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
        echo "hash=$hash"

    # The last publish's record, `<hash> clean|partial`: the key is this run's, so restore-keys finds the newest.
    - name: 'Restore the record of the last publish'
      if: steps.hash.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/published
        key: figma-code-connect-published-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: figma-code-connect-published-

    # Which records differ from the last publish: the log names them, the artifact holds the diff.
    - name: 'What changed since the last publish'
      id: changes
      if: steps.hash.outcome == 'success'
      shell: bash
      run: |
        last="$RUNNER_TEMP/published/parse.jsonl"; current="$RUNNER_TEMP/current/parse.jsonl"
        if [ ! -f "$last" ]; then echo "no record of a last publish to compare with"; exit 0; fi
        { grep -vxFf "$last" "$current" || true; grep -vxFf "$current" "$last" || true; } > "$RUNNER_TEMP/changed.jsonl"
        jq -r '"\(.component) (\(.label))"' "$RUNNER_TEMP/changed.jsonl" | sort -u > "$RUNNER_TEMP/changed.txt"
        if [ -s "$RUNNER_TEMP/changed.txt" ]; then
          diff -u "$last" "$current" > "$RUNNER_TEMP/changes.diff" || true
          echo "records that differ from the last publish ($(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ')), full diff in the artifact code-connect-changes:"
          cat "$RUNNER_TEMP/changed.txt"
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "no record differs from the last publish"
        fi
    - uses: actions/upload-artifact@v7
      if: steps.changes.outputs.present == 'true'
      with:
        name: code-connect-changes
        path: ${{ runner.temp }}/changes.diff

    # Publish unless the last publish was clean with this hash.
    - name: 'Decide whether to publish'
      id: decide
      if: steps.hash.outcome == 'success'
      shell: bash
      env:
        HASH: ${{ steps.hash.outputs.hash }}
        FORCE: ${{ inputs.force }}
      run: |
        record=$(cat "$RUNNER_TEMP/published/record" 2>/dev/null || true)
        echo "last publish: ${record:-none}"
        publish=true
        if [ "$FORCE" = "true" ]; then
          echo "::notice::force: publishing regardless of the last publish"
        elif [ "$record" = "$HASH clean" ]; then
          publish=false; echo "nothing changed since the last publish, not publishing"
        fi
        echo "publish=$publish" >> "$GITHUB_OUTPUT"

    # A record Figma refuses or cannot render fails nothing here: it is listed in the log, and the next step records a
    # partial publish.
    - name: 'figma:publish'
      id: publish
      if: steps.decide.outputs.publish == 'true'
      continue-on-error: true
      shell: bash
      # SPIKE, revert before merge: the dry run, so nothing is uploaded while the record still round-trips the cache
      run: npm run figma:publish:dry --workspace=@porsche-design-system/figma-code-connect 2>&1 | tee "$RUNNER_TEMP/publish.log"
      env:
        FIGMA_ACCESS_TOKEN: ${{ inputs.figma-access-token }}

    # Partial when publish failed or Figma refused a record, so the next run retries; the parse output feeds its diff.
    - name: 'Record this publish'
      id: record
      if: always() && steps.publish.outcome != 'skipped'
      shell: bash
      env:
        HASH: ${{ steps.hash.outputs.hash }}
        PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        # a record Figma refused, as scripts/figmaConnect.ts lists it
        REFUSED_LINE: '^  - figma[^ ]*\.json: '
      run: |
        state=clean
        if [ "$PUBLISH_OUTCOME" != "success" ] || grep -Eq "$REFUSED_LINE" "$RUNNER_TEMP/publish.log"; then state=partial; fi
        mkdir -p "$RUNNER_TEMP/published"
        echo "$HASH $state" > "$RUNNER_TEMP/published/record"
        cp "$RUNNER_TEMP/current/parse.jsonl" "$RUNNER_TEMP/published/parse.jsonl"
        echo "recorded: $HASH $state"
    - uses: actions/cache/save@v5
      if: always() && steps.record.outcome == 'success'
      with:
        path: ${{ runner.temp }}/published
        key: figma-code-connect-published-${{ github.run_id }}-${{ github.run_attempt }}

    # continue-on-error hides these failures from the action, so fail it here, once the record is saved.
    - name: 'Fail on a failed parse or publish'
      if: always() && (steps.hash.outcome == 'failure' || steps.publish.outcome == 'failure')
      shell: bash
      run: exit 1
