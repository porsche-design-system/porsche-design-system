name: 'Notify Slack Pipeline Failure'
description: 'Posts a failed run to Slack, one link per failed job. Reads the run back from the API, the attempt that failed, so the message and the run cannot disagree.'

inputs:
  run-id:
    description: 'ID of the workflow run to report.'
    required: true
  event-attempt:
    description: 'The attempt a `workflow_run` event reports. Empty when dispatched by hand.'
    required: false
  attempt:
    description: 'The attempt to report when dispatched by hand. Empty for the latest.'
    required: false
  slack-bot-token:
    description: 'Slack bot token with the `chat:write` scope.'
    required: true
  slack-channel-id:
    description: 'Slack channel to post to. The app must be a member of it.'
    required: true

runs:
  using: 'composite'
  steps:
    # `node_modules: 'false'` gives us Node without `npm ci` across ~35 workspaces.
    # The payload builder has zero dependencies precisely so this is possible.
    - uses: ./.github/actions/install
      with:
        node_modules: 'false'

    - name: 'Resolve run'
      id: resolve
      shell: bash
      # Always read run metadata from the API rather than the event payload, so that the
      # dispatch test path and the real path execute identical code.
      #
      # Re-running a build creates a new "attempt" of the same run. The API always answers
      # for the newest attempt, so if someone re-ran the build while this workflow was
      # starting up, we would describe the re-run instead of the failure we were told about.
      # That is how a passing run once got announced with "0 failed jobs". Asking for one
      # specific attempt avoids it.
      run: |
        # Which attempt failed? The event tells us. If it ever stops telling us, stop here
        # rather than guess, because guessing brings the bug above straight back.
        if [ -n "$EVENT_ATTEMPT" ]; then
          run_attempt="$EVENT_ATTEMPT"
        elif [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
          echo "::error::event did not say which attempt failed, refusing to guess"; exit 1
        elif [ -n "$INPUT_ATTEMPT" ]; then
          run_attempt="$INPUT_ATTEMPT"
        else
          run_attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.run_attempt')
        fi
        echo "::notice::reporting on run $RUN_ID attempt $run_attempt"
        attempt="repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$run_attempt"

        gh api "$attempt" > "$RUNNER_TEMP/run.json"

        head_branch=$(node -p "require('$RUNNER_TEMP/run.json').head_branch")
        # Mirrors contribution.yml:10-12. It lives in bash, not the `if:`, because GitHub
        # expressions have no glob and cannot express `v[0-9][0-9]`.
        case "$head_branch" in
          main|v[0-9]|v[0-9][0-9]) ;;
          *) echo "::notice::$head_branch is not a monitored branch, skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
        esac

        # Read every page of jobs, not just the first 100, so a big run loses nothing.
        # `--slurp` gathers the pages into an array; jq merges them back into one list.
        # It cannot be combined with `--jq` ("the --slurp option is not supported with --jq"),
        # and this is two commands rather than a pipe so `-e` catches either one failing.
        gh api --paginate --slurp "$attempt/jobs?per_page=100" > "$RUNNER_TEMP/job-pages.json"
        jq '{ jobs: (map(.jobs) | add) }' "$RUNNER_TEMP/job-pages.json" > "$RUNNER_TEMP/jobs.json"

        head_sha=$(node -p "require('$RUNNER_TEMP/run.json').head_sha")
        gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/pulls" > "$RUNNER_TEMP/pulls.json"
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ inputs.run-id }}
        EVENT_ATTEMPT: ${{ inputs.event-attempt }}
        INPUT_ATTEMPT: ${{ inputs.attempt }}

    - name: 'Build payload'
      if: steps.resolve.outputs.skip != 'true'
      shell: bash
      # Bare `node`, not `tsx`: Node 24 strips types natively, so no `npm ci` is needed.
      # `--disable-warning` silences a stderr-only notice about the missing root `"type"` field.
      run: |
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/build-slack-payload.ts \
          "$RUNNER_TEMP/run.json" \
          "$RUNNER_TEMP/jobs.json" \
          "$RUNNER_TEMP/pulls.json" \
          > "$RUNNER_TEMP/slack-payload.json"
        cat "$RUNNER_TEMP/slack-payload.json"
      env:
        SLACK_CHANNEL_ID: ${{ inputs.slack-channel-id }}

    - name: 'Send'
      if: steps.resolve.outputs.skip != 'true'
      # `chat.postMessage` with a bot token, same app as the release announcement. The Block Kit
      # `markdown` block is what lets a failed job link to its own step instead of trailing a bare
      # URL. See docs/slack-notifications.md.
      #
      # `payload-file-path` rather than an inline `payload:` because the message is multiline and
      # would otherwise have to survive YAML quoting.
      #
      # `errors: true` because the action's default is FALSE — without it a rejected request
      # (revoked token, uninvited app, bad channel) passes the step green and the failure is
      # invisible.
      uses: slackapi/slack-github-action@v4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-bot-token }}
        payload-file-path: ${{ runner.temp }}/slack-payload.json
        errors: true
