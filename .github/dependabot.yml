# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions-updates:
        patterns:
          - "*"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Held-back dependencies — kept in sync with docs/dependencies.md and the
    # updateGroups entry in .syncpackrc.json
    ignore:
      # Internal workspace packages, versioned via the release process (see docs/dependencies.md)
      - dependency-name: "@porsche-design-system/*"
      # Pinned to keep browser binaries in sync with committed VRT snapshots; upgrade deliberately (see docs/dependencies.md)
      - dependency-name: "@playwright/test"
      # Pinned: a patch-package patch targets this exact version (see docs/dependencies.md)
      - dependency-name: "@stencil/core"
      # Upgraded separately via `ng update`, not Dependabot (see docs/dependencies.md)
      - dependency-name: "@angular/*"
      - dependency-name: "ng-packagr"
      - dependency-name: "zone.js"
    groups:
      npm-updates:
        patterns:
          - "*"
