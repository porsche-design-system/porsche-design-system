name: 'Contribution'

# Triggers:
# - push: only on protected/release branches → full pipeline incl. release
# - pull_request: every PR (incl. forks) → build + test always;
#     - deploy/release are gated below to keep secrets out of fork PRs.
on:
  push:
    branches:
      - main
      - 'v[0-9]'      # v0–v9
      - 'v[0-9][0-9]' # v10–v99
  pull_request:

# Principle of the least privilege at workflow level; individual jobs (incl. reusable workflows
# called via `uses:`) elevate as needed via their own `permissions:` block.
permissions:
  contents: read

# Cancel in-flight runs on the same ref when superseded by a newer commit — but only for
# pull_request events. Never cancel a `push` run on main/v4: that would risk killing an
# in-progress release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  context:
    name: 'Context'
    # Resolve the storefront deployment target (used as both the storefront
    # `basePath` at build time AND the gh-pages folder at deploy time) ONCE
    # here, so build and deploy can never disagree.
    #
    # Strategy:
    #   - pull_request → "pr-<number>"  (avoids "<n>/merge" with embedded slash
    #                                    that github.ref_name would yield)
    #   - push to main → "nightly"
    #   - push to other branches (v*) → branch name
    runs-on: ubuntu-latest
    outputs:
      storefront-slug: ${{ steps.resolve.outputs.storefront-slug }}
      storefront-algolia: ${{ steps.resolve.outputs.storefront-algolia }}
    steps:
      - uses: actions/checkout@v7
      - name: 'Resolve'
        id: resolve
        uses: ./.github/actions/resolve-storefront-slug
  build:
    name: 'Build'
    uses: ./.github/workflows/build.yml
    with:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
      storefront-slug: ${{ needs.context.outputs.storefront-slug }}
    needs:
      - context
  test:
    name: 'Test'
    uses: ./.github/workflows/test.yml
    with:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    needs:
      - build
  deploy:
    name: 'Deploy'
    # Secrets are NOT available on pull_request events from forks (read-only token), and we must
    # not expose them. Run deploy only for:
    #   - any push event (always from a trusted branch, see `on.push.branches`)
    #   - pull_request events whose head is in this repository (internal PRs), excluding bot-authored
    #     PRs (dependabot, Copilot coding agent). Defense-in-depth: even an approved bot PR must never
    #     reach the deploy secrets — keep that path closed to automation-authored code.
    #
    # We gate on the PR *author* (`github.event.pull_request.user.login`), NOT on `github.actor`:
    # `github.actor` is whoever triggered the current run (e.g. a maintainer pushing a commit to, or
    # re-running, a bot's PR), so it does not reliably identify an automation-authored PR. The PR
    # author is stable regardless of who later pushes or re-runs the workflow.
    #
    # NOTE: deploy.yml pushes the storefront to a separate repo via the `gh-deploy-key-storefront`
    # SSH deploy key (not the workflow `GITHUB_TOKEN`), so no `contents: write` elevation is needed here.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.user.login != 'copilot-swe-agent[bot]' &&
       github.event.pull_request.user.login != 'Copilot')
    uses: ./.github/workflows/deploy.yml
    with:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
      storefront-slug: ${{ needs.context.outputs.storefront-slug }}
      storefront-algolia: ${{ needs.context.outputs.storefront-algolia }}
    needs:
      - context
      - test
      - build
    secrets:
      linode-aws-access-key-id: ${{ secrets.LINODE_AWS_ACCESS_KEY_ID }}
      linode-aws-secret-access-key: ${{ secrets.LINODE_AWS_SECRET_ACCESS_KEY }}
      gh-deploy-key-storefront: ${{ secrets.GH_DEPLOY_KEY_STOREFRONT }}
      algolia-app-id: ${{ secrets.ALGOLIA_APP_ID }}
      algolia-api-key: ${{ secrets.ALGOLIA_API_KEY }}
  release:
    name: 'Release'
    # Only on direct pushes to release branches — never on pull_request events.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v4')
    # Reusable workflows inherit the caller's GITHUB_TOKEN scopes; per-job permissions
    # in `release.yml` can only narrow, not widen. Grant the maximum scope needed here:
    #   - contents: write → create GitHub releases + tags
    #   - id-token: write → npm OIDC publish provenance
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    needs:
      - deploy
      - build
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      npm-token: ${{ secrets.NPM_TOKEN }}
      gh-deploy-key-storefront: ${{ secrets.GH_DEPLOY_KEY_STOREFRONT }}
      algolia-app-id: ${{ secrets.ALGOLIA_APP_ID }}
      algolia-api-key: ${{ secrets.ALGOLIA_API_KEY }}
