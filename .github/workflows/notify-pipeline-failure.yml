# Posts a Slack message when an important pipeline fails. See
# docs/slack-notifications.md.
#
# `workflow_run` runs the DEFAULT-BRANCH copy of this file, so a contributor cannot alter the
# notifier from inside their PR. That, plus the fork check in the job's `if:`, is what keeps the
# bot token out of a stranger's reach in this public repo.
#
name: 'Notify Pipeline Failure'

on:
  workflow_run:
    workflows:
      - 'Contribution' # .github/workflows/contribution.yml
      - 'OSS Review Toolkit' # .github/workflows/ort.yml
      # its weekly and dispatched runs; when Contribution calls it, the run is Contribution's
      - 'Figma Code Connect' # .github/workflows/figma-code-connect.yml
    types:
      - completed
    # Noise filter only, never a trust boundary — it reads the triggering run's head_branch,
    # which a fork controls. The fork check in the job's `if:` is the real control.
    branches:
      - main
      - 'v[0-9]'
      - 'v[0-9][0-9]'
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Workflow run ID to build a notification for.'
        required: true
        type: string
      attempt:
        description: 'Which attempt of that run. Leave empty for the latest.'
        required: false
        type: string

permissions:
  actions: read # list the jobs of the observed run
  contents: read # read commit metadata
  pull-requests: read # resolve commit -> PR author

jobs:
  notify:
    name: 'Notify'
    runs-on: ubuntu-latest
    # Event list is an ALLOWLIST so an unknown future trigger type is blocked by default.
    # `workflow_dispatch` appears twice: as `event_name` it is a maintainer testing THIS workflow,
    # as `workflow_run.event` it is a maintainer having manually run ORT.
    #
    # The `head_repository.full_name` check is not negotiable — a workflow_run workflow gets the
    # secret whatever triggered the upstream run, so it is what keeps a fork out of the channel.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out') &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/notify-slack-pipeline-failure
        with:
          run-id: ${{ inputs.run-id || github.event.workflow_run.id }}
          # Only one of these is ever set, depending on how this workflow was triggered.
          event-attempt: ${{ github.event.workflow_run.run_attempt }}
          attempt: ${{ inputs.attempt }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_FAILURE_CHANNEL_ID }}
