name: 'Figma Code Connect'

# Generates the Code Connect templates from component-meta, publishes what changed and tells design what to change in
# Figma, without gating a merge: Contribution calls it after the deploy on main, and it runs daily and on dispatch, on
# main only. On a pull request Contribution calls it after the deploy too, for a dry run: everything but the upload.
# Rationale, secrets and exit codes: docs/figma-code-connect.md.

on:
  # SPIKE, revert before merge: a push to this branch runs sync against the test copy
  push:
    branches:
      - issue/4745
  workflow_call:
    # named like the repository secrets, so `secrets.*` below reads the same under every trigger
    secrets:
      FIGMA_ACCESS_TOKEN:
        description: 'Figma token that pulls the library and publishes the Code Connect records.'
        required: true
      SLACK_BOT_TOKEN:
        description: 'Slack bot token shared by all notifications.'
        required: true
      SLACK_DESIGN_CHANNEL_ID:
        description: 'Slack channel that gets the changes design must make in Figma.'
        required: true
  schedule:
    - cron: '0 6 * * *' # daily run against the live library: reports design lines, publishes when a set or icon changed
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even when nothing changed since the last publish (repairs records edited in Figma)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Pull requests only, which Contribution calls after their deploy. The deploy already skips forks and bot-authored
  # pull requests, so the token reaches neither. Outside the sync's concurrency group, there, pending runs cancel each
  # other.
  dry-run:
    name: 'Dry run'
    if: vars.FIGMA_CODE_CONNECT_ENABLED == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      # figma:generate imports @porsche-design-system/component-meta, built by this run's build stage.
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'

      # Exit 2 is a Figma outage, no fault of this pull request: a warning, and nothing is checked against Figma.
      - name: 'figma:generate'
        id: generate
        shell: bash
        run: |
          set +e
          npm run figma:generate --workspace=@porsche-design-system/figma-code-connect
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 2 ]; then
            echo "::warning title=Figma Code Connect::Figma could not be read, so this pull request was not checked against it"
            exit 0
          fi
          exit "$code"
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      # Figma's preview and node validation of every record, as figma:publish runs them, without the upload.
      - name: 'figma:publish:dry'
        if: steps.generate.outputs.code == '0'
        run: npm run figma:publish:dry --workspace=@porsche-design-system/figma-code-connect
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      # figma:generate rewrote figma/accepted-gaps.json without the gaps Figma has closed. A closed gap left in the file
      # would accept that gap again, unseen, so it is red, and the rewritten file is the artifact to commit.
      - name: 'Accepted gaps up to date?'
        id: gaps
        if: always() && steps.generate.outputs.code == '0'
        shell: bash
        run: |
          file=packages/components/projects/figma-code-connect/figma/accepted-gaps.json
          if git diff --quiet -- "$file"; then echo "figma/accepted-gaps.json accepts no closed gap"; exit 0; fi
          git diff -- "$file"
          echo "stale=true" >> "$GITHUB_OUTPUT"
          echo "::error title=Figma Code Connect::figma/accepted-gaps.json accepts gaps Figma has closed: commit the artifact accepted-gaps.json in its place, or run npm run figma:generate"
          exit 1
      - uses: actions/upload-artifact@v7
        if: always() && steps.gaps.outputs.stale == 'true'
        with:
          path: packages/components/projects/figma-code-connect/figma/accepted-gaps.json
          archive: false

  sync:
    name: 'Pull Figma, generate, publish, notify design'
    # main only: a dispatch on another branch would publish its templates over main's records, and its publish record
    # would stay in that branch's cache, so main's next run would see nothing to publish.
    # SPIKE, revert before merge: also a push to issue/4745
    if: vars.FIGMA_CODE_CONNECT_ENABLED == 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref == 'refs/heads/issue/4745'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Never cancel a run in progress: publish uploads one label config after another, so a cancelled run mixes commits.
    # On the job, not the workflow: GitHub documents concurrency for a called workflow at the job level.
    concurrency:
      group: figma-code-connect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # A re-run of a commit that is no longer the branch tip skips every step below as it would publish an older checkout
      # over newer records and message Slack from it.
      - name: 'Re-run of an old commit?'
        id: tip
        shell: bash
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          tip=$([ "$ATTEMPT" -gt 1 ] && git ls-remote --quiet origin "refs/heads/$GITHUB_REF_NAME" | cut -f1 || true)
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::re-run of a commit that is no longer the tip of $GITHUB_REF_NAME; nothing to do, dispatch the workflow instead"
          fi

      - uses: ./.github/actions/install
        if: steps.tip.outputs.stale != 'true'
      # figma:generate imports @porsche-design-system/component-meta, whose dist/ is gitignored.
      - run: npm run build:core-dependencies
        if: steps.tip.outputs.stale != 'true'

      # The design lines it prints go to Slack.
      - name: 'figma:generate'
        id: generate
        if: steps.tip.outputs.stale != 'true'
        continue-on-error: true
        shell: bash
        run: npm run figma:generate --workspace=@porsche-design-system/figma-code-connect 2>&1 | tee "$RUNNER_TEMP/generate.log"
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: 'Publish'
        if: steps.generate.outcome == 'success'
        uses: ./.github/actions/figma-code-connect-publish
        with:
          figma-access-token: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          force: ${{ inputs.force }}

      - uses: actions/upload-artifact@v7
        if: always() && steps.generate.outcome == 'success'
        with:
          name: code-connect-generated
          path: packages/components/projects/figma-code-connect/generated

      - name: 'Notify design'
        if: always() && steps.generate.outcome == 'success'
        uses: ./.github/actions/notify-slack-figma-change
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_DESIGN_CHANNEL_ID }}

      # continue-on-error hides a failed generation from the job, so fail it here; Publish fails on its own, and design
      # lines never make it red.
      - name: 'Fail the job'
        if: always() && steps.generate.outcome == 'failure'
        run: exit 1
