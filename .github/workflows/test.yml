name: 'Test'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  assets:
    name: 'Assets'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:unit:assets:assets
      - run: npm run test:unit:assets:flags
      - run: npm run test:unit:assets:icons
      - run: npm run test:unit:assets:font-face
  tokens:
    name: 'Tokens'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:unit:tokens
  styles:
    name: 'Styles'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - run: npm run test:unit:styles:tailwindcss
      - run: npm run test:unit:styles:scss
      - run: npm run test:unit:styles:emotion
      - run: npm run test:unit:styles:vanilla-extract
      - run: npm run test:vrt:styles
      - name: 'VRT Regression'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-styles-vrt-chrome
          path: ./packages/styles/tests/vrt/results
  stylesheets:
    name: 'Stylesheets'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - run: npm run test:unit:stylesheets
  components-unit:
    name: 'Components Unit'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:unit:components
  components-js-unit:
    name: 'Components JS Unit'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - run: npm run test:unit:components-js:components-manager-core
      - run: npm run test:unit:components-js:components-manager-cli
      - run: npm run test:unit:components-js:components-wrapper
      - run: npm run test:unit:components-js:jsdom-polyfill
      - run: npm run test:unit:components-js:partials
      - name: 'Unit Regression'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-components-js-unit
          path: ./packages/components-js/tests/unit/results
  components-js-a11y:
    name: 'Components JS A11y'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:a11y:components-js
  components-js-e2e-chrome:
    name: 'Components JS E2E (Chrome)'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [ 1, 2, 3, 4 ]
        shardTotal: [ 4 ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:e2e:components-js:chrome:${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
  components-js-e2e-firefox:
    name: 'Components JS E2E (Firefox)'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [ 1, 2, 3, 4 ]
        shardTotal: [ 4 ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:e2e:components-js:firefox:${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
  components-js-e2e-safari:
    name: 'Components JS E2E (Safari)'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [ 1, 2, 3, 4 ]
        shardTotal: [ 4 ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:e2e:components-js:safari:${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
  components-js-vrt-chrome:
    name: 'Components JS VRT (Chrome)'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [ 1, 2, 3, 4, 5, 6 ]
        shardTotal: [ 6 ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:vrt:components-js:chrome:${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: 'VRT Regression'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-components-js-vrt-chrome-${{ matrix.shardIndex }}
          path: ./packages/components-js/tests/vrt/results
  components-js-vrt-safari:
    name: 'Components JS VRT (Safari)'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [ 1, 2, 3 ]
        shardTotal: [ 3 ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:vrt:components-js:safari:${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: 'VRT Regression'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-components-js-vrt-playwright-safari-${{ matrix.shardIndex }}
          path: ./packages/components-js/tests/vrt/results
  components-angular:
    name: 'Components Angular'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:unit:components-angular:vitest
      - run: npm run test:unit:components-angular:karma-ci
      - run: npm run test:e2e:components-angular
      - run: npm run test:vrt:components-angular
      - name: 'VRT Regression'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: components-angular-vrt-regression
          path: ./packages/components-angular/tests/vrt/results
  components-react:
    name: 'Components React'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:unit:components-react:react-wrapper
      - run: npm run test:e2e:components-react
      - run: npm run test:vrt:components-react
      - name: 'VRT Regression'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: components-react-vrt-regression
          path: ./packages/components-react/tests/vrt/results
  components-react-react-router:
    name: 'Components React/React Router'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:vrt:components-react/react-router
      - name: 'VRT Regression'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-components-react-react-router-vrt
          path: ./packages/components-react/projects/react-router/tests/vrt/results
  components-react-nextjs:
    name: 'Components React/NextJS'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:e2e:components-react/nextjs
      - run: npm run test:vrt:components-react/nextjs
      - run: npm run test:unit:components-react:react-ssr-wrapper
      - name: 'VRT Regression components-react/nextjs'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-components-react-nextjs-vrt
          path: ./packages/components-react/projects/nextjs/tests/vrt/results
  components-vue:
    name: 'Components Vue'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:unit:components-vue
      - run: npm run test:e2e:components-vue
      - run: npm run test:vrt:components-vue
      - name: 'VRT Regression'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-components-vue-vrt
          path: ./packages/components-vue/tests/vrt/results
  component-meta:
    name: 'Component Meta'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
