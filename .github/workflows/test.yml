        shardIndex: [ 1, 2, 3, 4, 5, 6 ]
        shardTotal: [ 6 ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:a11y:storefront:${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: 'A11y Regression'
        if: failure()
