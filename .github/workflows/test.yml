      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run build:generateTokensMeta --workspace=@porsche-design-system/tokens-meta
      - run: npm run test:unit:tokens-meta
  shared:
    name: 'Shared'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:unit:shared
  skills:
    name: 'Skills'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:unit:skills
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: generated-skill-trees
          path: ./packages/storefront/projects/skills/generated/
          if-no-files-found: error
  storefront-unit:
    name: 'Storefront Unit'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:unit:storefront
  storefront-e2e:
    name: 'Storefront E2E'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [ 1, 2, 3, 4 ]
        shardTotal: [ 4 ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
      - run: npm run test:e2e:storefront:${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: 'E2E Regression'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-storefront-e2e-${{ matrix.shardIndex }}
          path: ./packages/storefront/tests/e2e/results
  storefront-sitemap:
