        uses: actions/upload-artifact@v7
        with:
          name: regression-storefront-e2e-sitemap
          path: ./packages/storefront/tests/e2e/results
  storefront-a11y:
    name: 'Storefront A11y'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    strategy:
      fail-fast: false
