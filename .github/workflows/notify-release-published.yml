# Announces a release the pipeline did not announce itself — one created by hand, or recovered
# after CI missed it. `release.yml` covers every normal release, so this should be rare.
name: 'Notify Release Published'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce, e.g. "v4.7.0".'
        required: true
        type: string

permissions:
  contents: read # read the release being announced

jobs:
  notify:
    name: 'Notify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/notify-slack-release
        with:
          tag: ${{ inputs.tag }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
