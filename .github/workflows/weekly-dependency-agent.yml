# Weekly npm dependency update -- build-in-CI with an agentic self-healing LOOP.
#
# This is the ORCHESTRATOR + BUILDER. The deterministic build runs here in GitHub
# Actions; a GitHub Agentic Workflow (gh-aw), dependency-fix.md, only fixes
# failures. They ping-pong until the build is green or the retry budget is
# exhausted, and a pull request is opened ONLY when the build succeeds.
#
#   fresh run (schedule / manual):
#     npm run npm:update -> commit + push branch -> npm run build
#     (a failed bump/install, e.g. ERESOLVE, is captured and routed to the agent
#      too -- it is not treated differently from a build failure)
#
#   loop run (workflow_run: the agent finished and uploaded a "fix-patch"):
#     checkout branch -> download + git apply the patch -> commit + push
#                     -> npm run build
#
#   build SUCCEEDS -> open PR (labelled) -> DONE
#   build FAILS:
#     agent-runs-for-branch >= MAX_ATTEMPTS -> open escalation issue -> STOP
#     else -> upload build.log + dispatch the agent (dependency-fix.lock.yml)
#
# Why this shape:
#   - The agent job is READ-ONLY (gh-aw strict mode). It cannot push or dispatch;
#     it uploads its fix as the "fix-patch" artifact. THIS workflow re-enters via
#     'on: workflow_run' when the agent completes, applies the patch with a PAT,
#     and rebuilds -- so no PR is needed for the loop and none opens until green.
#   - The retry cap is stateless: we count how many agent runs already exist for
#     the branch (gh run list --branch), which also bounds "give-up" (empty
#     patch) loops.
#
# Token choice:
#   - GH_COPILOT_AGENT_TOKEN (PAT): checkout/push/apply and 'gh pr create', so
#     the eventual PR is user-authored and triggers the full Contribution CI.
#   - GITHUB_TOKEN (actions: write): dispatches the agent -- a workflow_dispatch
#     sent with it is allowed to start the agent run.
name: 'Weekly Dependency Agent'

on:
  schedule:
    # Mondays 06:00 UTC -- matches the weekly cadence in the runbook (UTC).
    - cron: '0 6 * * 1'
  # Manual fresh trigger.
  workflow_dispatch: {}
  # Loop re-entry: fires when the agent (dependency-fix) finishes on a working
  # branch and has uploaded its fix-patch. Filtered to dependency-update branches.
  workflow_run:
    workflows: ['Self-healing dependency build fixer']
    types: [completed]
    branches:
      - 'chore/dependency-updates**'

# Elevated: pushes a branch, opens a PR, dispatches the agent, may open an issue.
permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

env:
  # Max agent fix cycles before giving up and escalating to a human.
  MAX_ATTEMPTS: '3'

# Serialize per working branch. A fresh run uses a unique per-run branch; loop
# runs key on the triggering agent run's head branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Resolve fresh-vs-loop mode and the working branch up front.
      - name: 'Resolve mode'
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "fix_run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "branch=chore/dependency-updates-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

      # Check out with the PAT so branch pushes / PR creation are user-attributed.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_COPILOT_AGENT_TOKEN }}
          fetch-depth: 0

      - name: 'Prepare working branch'
        run: |
          git config user.name 'porsche-design-system-bot'
          git config user.email 'porsche-design-system-bot@users.noreply.github.com'
          git fetch origin "${{ github.event.repository.default_branch }}"
          if [ "${{ steps.mode.outputs.fresh }}" = "true" ]; then
            git checkout -b "${{ steps.mode.outputs.branch }}"
          else
            git fetch origin "${{ steps.mode.outputs.branch }}"
            git checkout "${{ steps.mode.outputs.branch }}"
          fi

      # Loop mode: apply the agent's fix patch onto the branch.
      - name: 'Apply agent fix patch'
        id: apply
        if: steps.mode.outputs.fresh != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_COPILOT_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p patchdir
          if ! gh run download "${{ steps.mode.outputs.fix_run_id }}" -n fix-patch -D patchdir; then
            echo 'No fix-patch artifact -- treating as give-up (no changes).'
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s patchdir/fix.patch ]; then
            echo 'Empty fix-patch (agent gave up) -- rebuilding unchanged branch.'
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Apply the patch; escalate immediately if it does not apply cleanly.
          if ! git apply --index --3way patchdir/fix.patch; then
            echo "::error::Agent fix patch did not apply cleanly on ${{ steps.mode.outputs.branch }}."
            gh issue create \
              --title "Weekly dependency update: agent patch failed to apply (${{ steps.mode.outputs.branch }})" \
              --label 'dependencies' \
              --body "The agent fix patch from run ${{ steps.mode.outputs.fix_run_id }} did not apply cleanly onto ${{ steps.mode.outputs.branch }}. Take over manually per docs/runbooks/dependency-updates-agent.md."
            exit 1
          fi
          git commit -m 'fix(deps-agent): apply automated dependency build fix'
          git push origin "${{ steps.mode.outputs.branch }}"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install

      # Fresh mode: deterministic syncpack bump, then push the branch.
      #
      # The bump itself can fail before we ever build -- most commonly an
      # `ERESOLVE` peer conflict during `npm install` that needs an `overrides`
      # entry (e.g. rollup-plugin-dts pinning an older `typescript` peer). That is
      # exactly the agent's job, so we DON'T hard-fail here: we capture the output
      # to build.log, commit + push whatever manifests changed (even without a
      # regenerated lockfile), and set `failed=true` to route into the same fixer
      # loop the build-failure path uses.
      - name: 'Apply syncpack update (fresh run only)'
        id: update
        if: steps.mode.outputs.fresh == 'true'
        run: |
          branch="${{ steps.mode.outputs.branch }}"
          # npm:outdated (syncpack --check) exits 0 when nothing is outdated.
          if npm run npm:outdated; then
            echo 'Nothing outdated -- skipping.'
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run the bump + lockfile refresh, capturing output. `|| ok=false`
          # keeps `set -e` from aborting the step so we can still commit/push and
          # hand the log to the agent.
          ok=true
          {
            npm run npm:update &&
            npm run npm:lint:fix &&
            npm run npm:format:fix &&
            rm -f package-lock.json &&
            npm install
          } 2>&1 | tee build.log || ok=false
          # Persist whatever changed so the agent has a branch to fix.
          git add -A
          git commit -m 'chore(deps): weekly npm dependency update' || echo 'nothing to commit'
          git push origin "$branch"
          if [ "$ok" = "false" ]; then
            echo "::warning::Dependency bump failed (likely ERESOLVE) -- routing to the agent."
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The deterministic build. Capture output to build.log; keep going on
      # failure so we can hand the log to the agent. Skipped when the fresh bump
      # already failed (its log is routed to the agent below).
      - name: 'Build'
        id: build
        if: steps.update.outputs.skip != 'true' && steps.update.outputs.failed != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # Success path: open the PR (only now that the build is green).
      - name: 'Write PR body'
        if: steps.build.outcome == 'success' && steps.update.outputs.skip != 'true'
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<'BODY_EOF'
          Automated weekly npm dependency update -- opened only after a green build.

          Generated by .github/workflows/weekly-dependency-agent.yml following
          docs/runbooks/dependency-updates-agent.md. If the build failed initially, the
          agentic workflow .github/workflows/dependency-fix.md fixed it in a capped loop
          (applied fix commits are prefixed `fix(deps-agent):`).

          ## Reviewer checklist
          - [ ] Grouped upgrades look correct (framework families in lockstep)
          - [ ] Any added/removed overrides are justified (npm run npm:audit)
          - [ ] Held-back deps untouched (Stencil / Playwright / Angular migrations / internal)
          BODY_EOF

      - name: 'Open pull request (build is green)'
        if: steps.build.outcome == 'success' && steps.update.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_COPILOT_AGENT_TOKEN }}
        run: |
          branch="${{ steps.mode.outputs.branch }}"
          if gh pr view "$branch" >/dev/null 2>&1; then
            echo 'PR already exists -- nothing to do.'
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title 'chore(deps): weekly npm dependency update' \
              --label 'dependencies' \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi

      # Failure path: escalate at the cap, otherwise hand off to the agent.
      # Fires for a failed build OR a failed fresh bump (ERESOLVE etc.).
      - name: 'Upload build log (build failed)'
        if: steps.build.outcome == 'failure' || steps.update.outputs.failed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: 'Dispatch fixer or escalate (build failed)'
        if: steps.build.outcome == 'failure' || steps.update.outputs.failed == 'true'
        env:
          # GITHUB_TOKEN with actions:write -- a workflow_dispatch sent with it is
          # allowed to start the agent run.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ steps.mode.outputs.branch }}"
          # Stateless retry cap: how many agent runs already exist for this branch?
          attempt=$(gh run list --workflow=dependency-fix.lock.yml --branch "$branch" -L 100 --json databaseId -q 'length' || echo 0)
          echo "Agent runs so far for ${branch}: ${attempt} (cap ${MAX_ATTEMPTS})."
          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
            echo "::error::Build still failing after ${MAX_ATTEMPTS} agent fix attempts on ${branch}."
            gh issue create \
              --title "Weekly dependency update needs manual attention (${branch})" \
              --label 'dependencies' \
              --body "The deterministic build is still failing after ${MAX_ATTEMPTS} agentic fix attempts on branch ${branch}. Last failing run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Follow docs/runbooks/dependency-updates-agent.md and take over manually."
            exit 1
          fi
          next=$((attempt + 1))
          echo "Build failed -- dispatching dependency-fix (fix attempt ${next}/${MAX_ATTEMPTS})."
          gh workflow run dependency-fix.lock.yml \
            --ref "$branch" \
            -f branch="$branch" \
            -f attempt="$next" \
            -f build_run_id="${GITHUB_RUN_ID}"

