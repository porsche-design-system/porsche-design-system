name: 'Release'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow'
        required: true
        type: string
    secrets:
      github-token:
        description: 'github token for container registry'
        required: true
      npm-token:
        description: 'npm access token for publishing to npmjs.org'
        required: true
      aws-storefront-release-role-arn:
        description: 'IAM role assumed via OIDC to publish pinned releases and replace major aliases. Cannot delete pinned versions.'
        required: true
      aws-storefront-bucket:
        description: 'Storefront origin bucket.'
        required: true
      aws-storefront-distribution-id:
        description: 'Storefront CloudFront distribution to invalidate.'
        required: true
      aws-storefront-base-url:
        description: 'Origin serving the published storefront, used to check whether a version is already published.'
        required: true
      algolia-app-id:
        description: 'Algolia App ID (Storefront).'
        required: true
      algolia-api-key:
        description: 'Algolia API Key (Storefront).'
        required: true
      slack-bot-token:
        description: 'Slack bot token (chat:write) for the release announcement. Not required: a missing secret must not stop a release, it fails the announcement job instead.'
        required: false
      slack-release-channel-id:
        description: 'Slack channel the release announcement is posted to. A secret rather than a literal so the channel can be changed without a pull request.'
        required: false

# Default to the least privilege; jobs that need more declare it explicitly.
permissions:
  contents: read

jobs:
  check-publication-status:
    name: 'Check Publication Status'
    runs-on: ubuntu-latest
    # Only reads: checks out the repo and queries the npm registry. Declared explicitly so it doesn't
    # inherit the broader (`contents: write` + `id-token: write`) scope the caller grants at the call site.
    permissions:
      contents: read
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    outputs:
      components-version: ${{ steps.get_npm_version.outputs.version }}
      is-stable: ${{ steps.source.outputs.is-stable }}
      is-release-commit: ${{ steps.source.outputs.is-release-commit }}
      major-slug: ${{ steps.source.outputs.major-slug }}
      is-components-js-published: ${{ steps.is_components_js_published_check.outputs.is-published }}
      is-components-angular-published: ${{ steps.is_components_angular_published_check.outputs.is-published }}
      is-components-react-published: ${{ steps.is_components_react_published_check.outputs.is-published }}
      is-components-vue-published: ${{ steps.is_components_vue_published_check.outputs.is-published }}
      is-storefront-published: ${{ steps.is_storefront_published_check.outputs.is-published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/install
      - name: 'Get Package Version'
        id: get_npm_version
        uses: ./.github/actions/get-local-package-version
        with:
          path: 'packages/components'
      - name: 'Resolve release source'
        id: source
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .github/scripts/storefront-release.ts source
      - name: 'Check if "@porsche-design-system/components-js" version is published'
        id: is_components_js_published_check
        uses: ./.github/actions/is-npm-package-published
        with:
          package-name: '@porsche-design-system/components-js'
          package-version: ${{ steps.get_npm_version.outputs.version }}
      - name: 'Check if "@porsche-design-system/components-angular" version is published'
        id: is_components_angular_published_check
        uses: ./.github/actions/is-npm-package-published
        with:
          package-name: '@porsche-design-system/components-angular'
          package-version: ${{ steps.get_npm_version.outputs.version }}
      - name: 'Check if "@porsche-design-system/components-react" version is published'
        id: is_components_react_published_check
        uses: ./.github/actions/is-npm-package-published
        with:
          package-name: '@porsche-design-system/components-react'
          package-version: ${{ steps.get_npm_version.outputs.version }}
      - name: 'Check if "@porsche-design-system/components-vue" version is published'
        id: is_components_vue_published_check
        uses: ./.github/actions/is-npm-package-published
        with:
          package-name: '@porsche-design-system/components-vue'
          package-version: ${{ steps.get_npm_version.outputs.version }}
      - name: 'Check if Storefront version is published'
        id: is_storefront_published_check
        uses: ./.github/actions/is-storefront-version-published
        with:
          version: ${{ steps.get_npm_version.outputs.version }}
          base-url: ${{ secrets.aws-storefront-base-url }}
  npm-components-js:
    name: 'NPM (Components JS)'
    needs: check-publication-status
    if: ${{ needs.check-publication-status.outputs.is-components-js-published == 'false' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-npm-components-js
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - run: chmod +x ./.github/scripts/release-npm.sh
      - name: 'Publish'
        run: ./.github/scripts/release-npm.sh packages/components-js/dist/components-wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          NPM_CONFIG_PROVENANCE: true
  npm-components-angular:
    name: 'NPM (Components Angular)'
    needs:
      - check-publication-status
      # - npm-components-js
    if: ${{ needs.check-publication-status.outputs.is-components-angular-published == 'false' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-npm-components-angular
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - run: chmod +x ./.github/scripts/release-npm.sh
      - name: 'Publish'
        run: ./.github/scripts/release-npm.sh packages/components-angular/dist/angular-wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          NPM_CONFIG_PROVENANCE: true
  npm-components-react:
    name: 'NPM (Components React)'
    needs:
      - check-publication-status
      # - npm-components-js
    if: ${{ needs.check-publication-status.outputs.is-components-react-published == 'false' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-npm-components-react
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - run: chmod +x ./.github/scripts/release-npm.sh
      - name: 'Publish'
        run: ./.github/scripts/release-npm.sh packages/components-react/dist/react-wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          NPM_CONFIG_PROVENANCE: true
  npm-components-vue:
    name: 'NPM (Components Vue)'
    needs:
      - check-publication-status
      # - npm-components-js
    if: ${{ needs.check-publication-status.outputs.is-components-vue-published == 'false' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-npm-components-vue
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - run: chmod +x ./.github/scripts/release-npm.sh
      - name: 'Publish'
        run: ./.github/scripts/release-npm.sh packages/components-vue/dist/vue-wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          NPM_CONFIG_PROVENANCE: true
  github-release:
    name: 'GitHub Release'
    needs:
      - check-publication-status
      - npm-components-js
      - npm-components-angular
      - npm-components-react
      - npm-components-vue
    # Allow recovery when npm succeeded in an earlier attempt, but only from the
    # release commit. Ordinary commits retaining its version must never create a tag.
    if: |
      !cancelled()
      && needs.check-publication-status.result == 'success'
      && needs.check-publication-status.outputs.is-release-commit == 'true'
      && (needs.npm-components-js.result == 'success' || needs.npm-components-js.result == 'skipped')
      && (needs.npm-components-angular.result == 'success' || needs.npm-components-angular.result == 'skipped')
      && (needs.npm-components-react.result == 'success' || needs.npm-components-react.result == 'skipped')
      && (needs.npm-components-vue.result == 'success' || needs.npm-components-vue.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub releases (and the underlying tag) via the GitHub API
    outputs:
      # The action exits 0 for the no-op cases too, so a green job does not mean a release exists.
      created: ${{ steps.create_release.outputs.created }}
    steps:
      - uses: actions/checkout@v7
      - name: 'Create GitHub Release'
        id: create_release
        uses: ./.github/actions/create-github-release
        with:
          version: ${{ needs.check-publication-status.outputs.components-version }}
          github-token: ${{ secrets.github-token }}
  notify-release:
    name: 'Notify Release'
    needs:
      - check-publication-status
      - github-release
      - storefront
      - storefront-major
      - storefront-algolia
      - storefront-major-algolia
    # A pre-release, an already-released tag and a draft all report false, and a failed
    # `github-release` leaves this empty.
    # A successful major job may intentionally leave a newer release in place.
    if: >-
      !cancelled()
      && needs.github-release.outputs.created == 'true'
      && (needs.storefront.result == 'success' || needs.storefront.result == 'skipped')
      && needs.storefront-major.result == 'success'
      && needs.storefront-algolia.result == 'success'
      && needs.storefront-major-algolia.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the release being announced
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/notify-slack-release
        with:
          tag: v${{ needs.check-publication-status.outputs.components-version }}
          slack-bot-token: ${{ secrets.slack-bot-token }}
          slack-channel-id: ${{ secrets.slack-release-channel-id }}
  storefront:
    name: 'Storefront'
    needs: check-publication-status
    if: >-
      needs.check-publication-status.outputs.is-storefront-published == 'false'
      && (needs.check-publication-status.outputs.is-stable == 'false'
          || needs.check-publication-status.outputs.is-release-commit == 'true')
    runs-on: ubuntu-latest
    # The `storefront` environment is the OIDC trust condition of `storefront-release-deployer`, and
    # the branch policy on it (`main`, `v[0-9]`, `v[0-9][0-9]`) is what keeps that role out of reach
    # of any other ref.
    environment: storefront
    # Deploys via a short-lived OIDC token, not the workflow `GITHUB_TOKEN`, so read access to the
    # repository suffices. Declared explicitly so it does not inherit the caller's broader write scope.
    permissions:
      contents: read
      id-token: write # Mint the OIDC token that `configure-aws-credentials` exchanges for the role
    # Deliberately not the Playwright container the other jobs use: it has no AWS CLI, and Ubuntu's
    # `awscli` apt package is still v1. The standard runner image ships v2, and this job only builds
    # the storefront and uploads it — none of it needs a browser.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      # Rebuilt rather than reused: the artifact was built with the branch slug as `basePath`, and a
      # released version is served from `/v<version>/`.
      - name: 'Build Storefront'
        run: NEXT_PUBLIC_BASE_PATH="v${{ needs.check-publication-status.outputs.components-version }}" npm run build:storefront
      - name: 'Assume AWS role'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.aws-storefront-release-role-arn }}
          aws-region: eu-central-1
      - name: 'Deploy (S3)'
        uses: ./.github/actions/s3-deploy
        with:
          source: ./packages/storefront/dist
          slug: 'v${{ needs.check-publication-status.outputs.components-version }}'
          bucket: ${{ secrets.aws-storefront-bucket }}
          distribution-id: ${{ secrets.aws-storefront-distribution-id }}
          # A pinned version is published once and never changes, unlike the moving major aliases.
          # The role cannot delete under a pinned
          # prefix either, so this holds by command and by policy.
          delete: 'false'
          wait-for-invalidation: 'true'
  storefront-algolia:
    name: 'Algolia (Pinned Storefront)'
    needs:
      - check-publication-status
      - storefront
    # Indexing is independent of the upload existence check, including on a full rerun.
    if: >-
      !cancelled()
      && needs.check-publication-status.result == 'success'
      && (needs.check-publication-status.outputs.is-stable == 'false'
          || needs.check-publication-status.outputs.is-release-commit == 'true')
      && (needs.storefront.result == 'success'
          || (needs.storefront.result == 'skipped'
              && needs.check-publication-status.outputs.is-storefront-published == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      # Records use relative routes and page text, not the build's basePath.
      # This artifact is available even when pinned uploads are skipped on a full rerun.
      - uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - name: 'Index pinned storefront'
        run: npm run updateAlgolia
        env:
          P_CURRENT_BRANCH: v${{ needs.check-publication-status.outputs.components-version }}
          ALGOLIA_APP_ID: ${{ secrets.algolia-app-id }}
          ALGOLIA_API_KEY: ${{ secrets.algolia-api-key }}
  storefront-major:
    name: 'Storefront (Major)'
    needs:
      - check-publication-status
      - github-release
      - storefront
    if: >-
      !cancelled()
      && needs.check-publication-status.outputs.is-release-commit == 'true'
      && needs.github-release.result == 'success'
      && (needs.storefront.result == 'success' || needs.storefront.result == 'skipped')
    runs-on: ubuntu-latest
    environment: storefront
    permissions:
      contents: read
      id-token: write
    # Serialize promotions across main and maintenance branches.
    # Resolve the newest release only after acquiring this lock.
    concurrency:
      group: storefront-major-${{ needs.check-publication-status.outputs.major-slug }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - name: 'Resolve promotion'
        id: resolve
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .github/scripts/storefront-release.ts promotion
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 'Build Storefront'
        if: steps.resolve.outputs.promote == 'true'
        run: npm run build:storefront
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.resolve.outputs.slug }}
      - name: 'Assume AWS role'
        if: steps.resolve.outputs.promote == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.aws-storefront-release-role-arn }}
          aws-region: eu-central-1
      - name: 'Deploy (S3)'
        if: steps.resolve.outputs.promote == 'true'
        uses: ./.github/actions/s3-deploy
        with:
          source: ./packages/storefront/dist
          slug: ${{ steps.resolve.outputs.slug }}
          bucket: ${{ secrets.aws-storefront-bucket }}
          distribution-id: ${{ secrets.aws-storefront-distribution-id }}
          delete: 'true'
          wait-for-invalidation: 'true'
  storefront-major-algolia:
    name: 'Algolia (Major Storefront)'
    needs:
      - check-publication-status
      - storefront-major
    if: >-
      !cancelled()
      && needs.storefront-major.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Share the deployment lock and recheck eligibility: retrying an old index job
    # must not overwrite the index of a newer release deployed in the meantime.
    concurrency:
      group: storefront-major-${{ needs.check-publication-status.outputs.major-slug }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - name: 'Resolve promotion'
        id: resolve
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .github/scripts/storefront-release.ts promotion
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 'Index major storefront'
        if: steps.resolve.outputs.promote == 'true'
        run: npm run updateAlgolia
        env:
          P_CURRENT_BRANCH: ${{ steps.resolve.outputs.slug }}
          ALGOLIA_APP_ID: ${{ secrets.algolia-app-id }}
          ALGOLIA_API_KEY: ${{ secrets.algolia-api-key }}
