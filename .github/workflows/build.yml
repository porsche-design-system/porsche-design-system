name: 'Build'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow.'
        required: true
        type: string
      storefront-slug:
        description: 'Storefront deploy target slug (e.g. "pr-1234", "nightly", "v4"). Used as the storefront basePath so the build matches the gh-pages folder produced by the deploy workflow.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: npm run lint
      # Guards against npm pruning platform-specific native bindings from the lockfile
      # (https://github.com/npm/cli/issues/4828) — see docs/dependencies.md.
      - run: npm run npm:verify-lock
  build-development:
    name: 'Development'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: npm run build:shared
      - run: npm run build:tokens
      - run: npm run build:assets
      - run: npm run build:styles
      - run: npm run build:utilities
      - run: npm run build:stylesheets
      - run: npm run build:component-meta
      - run: npm run build:components
      - run: npm run build:skills
      - run: npm run build:components-js
      - run: npm run build:components-angular
      - run: npm run build:components-react
      - run: npm run build:components-vue
      - run: npm run build:storefront
      - uses: actions/upload-artifact@v7
        with:
          name: build-development
          include-hidden-files: true
          path: |
            ./packages/storefront/dist/
            ./packages/storefront/projects/skills/generated/
            ./packages/storefront/projects/stackblitz/dist/
            ./packages/components-react/dist/
            ./packages/components-vue/dist/
            ./packages/component-meta/dist/
            ./packages/shared/dist/
            ./packages/utilities/projects/ag-grid/dist/
            ./packages/styles/dist/
            ./packages/styles/projects/shared-styles/dist/
            ./packages/styles/projects/shared-styles/src/generated/
            ./packages/styles/projects/tailwindcss/dist/
            ./packages/styles/projects/tailwindcss/meta/
            ./packages/styles/projects/scss/dist/
            ./packages/styles/projects/scss/meta/
            ./packages/styles/projects/emotion/dist/
            ./packages/styles/projects/emotion/meta/
            ./packages/styles/projects/emotion/emotionMeta/deprecations.ts
            ./packages/styles/projects/vanilla-extract/dist/
            ./packages/styles/projects/vanilla-extract/meta/
            ./packages/styles/projects/vanilla-extract/vanillaExtractMeta/deprecations.ts
            ./packages/components/dist/
            ./packages/components/projects/stylesheets/dist/
            ./packages/components/projects/stylesheets/lib/
            ./packages/components/projects/stylesheets/meta/
            ./packages/components-js/dist/
            ./packages/components-js/projects/components-manager-cli/dist/
            ./packages/components-js/projects/components-manager-core/dist/
            ./packages/components-js/projects/partials/dist/
            ./packages/assets/dist/
            ./packages/assets/projects/font-face/dist/
            ./packages/assets/projects/marque/dist/
            ./packages/assets/projects/crest/dist/
            ./packages/assets/projects/meta-icons/dist/
            ./packages/assets/projects/icons/dist/
            ./packages/assets/projects/flags/dist/
            ./packages/assets/projects/fonts/dist/
            ./packages/assets/projects/model-signatures/dist/
            ./packages/tokens/dist/
            ./packages/tokens/projects/tokens-meta/dist/
            ./packages/components-angular/dist/
            ./packages/assets/cdn/
            ./packages/shared/bin/
            ./packages/assets/bin/
            ./packages/components-js/projects/components-wrapper/lib/
            ./packages/assets/projects/icons/tests/unit/results/stats.json
            ./packages/assets/projects/flags/tests/unit/results/stats.json
            ./packages/components-js/projects/partials/src/lib/partials.tsx
            ./packages/components-angular/projects/angular-wrapper/src/lib/
            ./packages/components-angular/src/app/pages/generated/
            ./packages/components-react/projects/react-wrapper/src/lib/
            ./packages/components-react/projects/react-ssr-wrapper/src/
            ./packages/components-react/src/pages/generated/
            ./packages/components-react/projects/nextjs/.next/
            ./packages/components-react/projects/react-router/build/
            ./packages/components-vue/projects/vue-wrapper/src/lib/
            ./packages/component-meta/src/lib/componentMeta.ts
            ./packages/tokens/projects/tokens-meta/src/lib/tokensMeta.ts
            ./packages/shared/src/lib/
          if-no-files-found: error
  build-production:
    name: 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: npm run build:shared
      - run: npm run build:tokens
      - run: npm run build:assets
      - run: npm run build:styles-prod
      - run: npm run build:utilities
      - run: npm run build:stylesheets-prod
      - run: npm run build:component-meta
      - run: npm run build:components-prod
      - run: npm run build:skills
      - run: npm run build:components-js-prod
      - run: npm run build:components-angular
      - run: npm run build:components-react
      - run: npm run build:components-vue
      - run: NEXT_PUBLIC_BASE_PATH="${{ inputs.storefront-slug }}" npm run build:storefront
      - uses: actions/upload-artifact@v7
        with:
          name: build-production
          include-hidden-files: true
          path: |
            ./packages/storefront/dist/
            ./packages/storefront/projects/skills/generated/
            ./packages/storefront/projects/stackblitz/dist/
            ./packages/components-react/dist/
            ./packages/components-vue/dist/
            ./packages/component-meta/dist/
            ./packages/shared/dist/
            ./packages/utilities/projects/ag-grid/dist/
            ./packages/styles/dist/
            ./packages/styles/projects/shared-styles/dist/
            ./packages/styles/projects/shared-styles/src/generated/
            ./packages/styles/projects/tailwindcss/dist/
            ./packages/styles/projects/tailwindcss/meta/
            ./packages/styles/projects/scss/dist/
            ./packages/styles/projects/scss/meta/
            ./packages/styles/projects/emotion/dist/
            ./packages/styles/projects/emotion/meta/
            ./packages/styles/projects/emotion/emotionMeta/deprecations.ts
            ./packages/styles/projects/vanilla-extract/dist/
            ./packages/styles/projects/vanilla-extract/meta/
            ./packages/styles/projects/vanilla-extract/vanillaExtractMeta/deprecations.ts
            ./packages/components/dist/
            ./packages/components/projects/stylesheets/dist/
            ./packages/components/projects/stylesheets/lib/
            ./packages/components/projects/stylesheets/meta/
            ./packages/components-js/dist/
            ./packages/components-js/projects/components-manager-cli/dist/
            ./packages/components-js/projects/components-manager-core/dist/
            ./packages/components-js/projects/partials/dist/
            ./packages/assets/dist/
            ./packages/assets/projects/font-face/dist/
            ./packages/assets/projects/marque/dist/
            ./packages/assets/projects/crest/dist/
            ./packages/assets/projects/meta-icons/dist/
            ./packages/assets/projects/icons/dist/
            ./packages/assets/projects/flags/dist/
            ./packages/assets/projects/fonts/dist/
            ./packages/assets/projects/model-signatures/dist/
            ./packages/tokens/dist/
            ./packages/tokens/projects/tokens-meta/dist/
            ./packages/components-angular/dist/
            ./packages/assets/cdn/
            ./packages/shared/bin/
            ./packages/assets/bin/
            ./packages/components-js/projects/components-wrapper/lib/
            ./packages/components-js/tests/unit/results/stats-raw.json
            ./packages/components-js/projects/partials/src/lib/partials.tsx
            ./packages/components-angular/projects/angular-wrapper/src/lib/
            ./packages/components-angular/src/app/pages/generated/
            ./packages/components-react/projects/react-wrapper/src/lib/
            ./packages/components-react/projects/react-ssr-wrapper/src/
            ./packages/components-react/src/pages/generated/
            ./packages/components-react/projects/nextjs/.next/
            ./packages/components-react/projects/react-router/build/
            ./packages/components-vue/projects/vue-wrapper/src/lib/
            ./packages/component-meta/src/lib/componentMeta.ts
            ./packages/tokens/projects/tokens-meta/src/lib/tokensMeta.ts
            ./packages/shared/src/lib/
          if-no-files-found: error
