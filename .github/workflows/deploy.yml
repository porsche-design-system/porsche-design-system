name: 'Deploy'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow.'
        required: true
        type: string
      storefront-slug:
        description: 'Storefront deploy target slug (e.g. "pr-1234", "nightly", "v4"). Used as the gh-pages folder; must match the storefront basePath baked in at build time.'
        required: true
        type: string
      storefront-algolia:
        description: 'Whether to (re)index the storefront on Algolia. Resolved once in the caller (contribution.yml → context job); should be "true" only for production-ish refs (main + version branches), never PRs.'
        required: true
        type: string
    secrets:
      linode-aws-access-key-id:
        description: 'AWS Access Key ID for Linode / Akamai CDN.'
        required: true
      linode-aws-secret-access-key:
        description: 'AWS Secret Access Key for Linode / Akamai CDN.'
        required: true
      gh-deploy-key-storefront:
        description: 'GitHub Deploy Key for GitHub Pages (Storefront).'
        required: true
      algolia-app-id:
        description: 'Algolia App ID (Storefront).'
        required: true
      algolia-api-key:
        description: 'Algolia API Key (Storefront).'
        required: true
      aws-access-key-id-mcp:
        description: 'AWS Access Key ID for MCP S3 bucket and Bedrock.'
        required: true
      aws-secret-access-key-mcp:
        description: 'AWS Secret Access Key for MCP S3 bucket and Bedrock.'
        required: true
      mcp-s3-bucket-name:
        description: 'S3 bucket name for MCP context snapshots.'
        required: true
      mcp-knowledge-base-id:
        description: 'AWS Bedrock Knowledge Base ID for MCP.'
        required: true
      mcp-data-source-id:
        description: 'AWS Bedrock Data Source ID for MCP.'
        required: true

jobs:
  akamai-cdn-assets:
    name: 'Akamai CDN (Assets)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
        with:
          node_modules: 'false'
          rclone: 'true'
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - name: 'Rclone (Components)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/components/'
          target: 'components/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Crest)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/crest/'
          target: 'crest/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Flags)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/flags/'
          target: 'flags/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Fonts)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/fonts/'
          target: 'fonts/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Icons)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/icons/'
          target: 'icons/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Marque)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/marque/'
          target: 'marque/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Meta Icons)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/meta-icons/'
          target: 'meta-icons/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Model Signatures)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/model-signatures/'
          target: 'model-signatures/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Styles)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/styles/'
          target: 'styles/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
  akamai-cdn-assets-smoke:
    name: 'Akamai CDN (Assets) Smoke'
    needs:
      - akamai-cdn-assets
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - run: npm run test:smoke:components-js
      - run: npm run test:smoke:components-angular
      - run: npm run test:smoke:components-react
      - run: npm run test:smoke:components-vue
  deploy-context:
    name: 'Deploy Context (MCP Knowledge Base)'
    needs:
      - akamai-cdn-assets-smoke
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - name: 'Check version and deploy context'
        run: |
          VERSION=$(node -p "require('./packages/components/package.json').version")
          echo "Detected version: ${VERSION}"
          if echo "${VERSION}" | grep -q '-'; then
            echo "Pre-release version detected — skipping context deploy."
            exit 0
          fi
          CONTEXT_DIR="packages/mcp-server/v${VERSION}"
          if [ ! -d "${CONTEXT_DIR}" ]; then
            echo "ERROR: Context directory not found at ${CONTEXT_DIR}"
            ls -la packages/mcp-server/
            exit 1
          fi
          FILE_COUNT=$(find "${CONTEXT_DIR}" -type f | wc -l)
          echo "Context snapshots found: ${FILE_COUNT} files in ${CONTEXT_DIR}"
          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "ERROR: No files in context directory"
            exit 1
          fi
          npm run deploy-context
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.aws-access-key-id-mcp }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.aws-secret-access-key-mcp }}
          AWS_REGION: eu-central-1
          S3_BUCKET_NAME: ${{ secrets.mcp-s3-bucket-name }}
          KNOWLEDGE_BASE_ID: ${{ secrets.mcp-knowledge-base-id }}
          DATA_SOURCE_ID: ${{ secrets.mcp-data-source-id }}
  github-pages-storefront:
    name: 'GitHub Pages (Storefront)'
    needs:
      - deploy-context
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: 'porsche-design-system/porsche-design-system-storefront'
          ssh-key: ${{ secrets.gh-deploy-key-storefront }}
          ref: 'main'
          path: 'gh-pages'
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - name: 'Deploy (GH Pages)'
        uses: ./.github/actions/gh-pages
        with:
          source: ./packages/storefront/dist
          # Target is resolved once in the caller (contribution.yml → context job)
          # and passed through, so the gh-pages folder always matches the
          # storefront basePath that was baked in at build time.
          target: ${{ inputs.storefront-slug }}
          # Algolia indexing flag is also resolved once in the caller
          # (contribution.yml → context job) and passed through.
          algolia: ${{ inputs.storefront-algolia }}
        env:
          ALGOLIA_APP_ID: ${{ secrets.algolia-app-id }}
          ALGOLIA_API_KEY: ${{ secrets.algolia-api-key }}
