name: 'Deploy'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow.'
        required: true
        type: string
      storefront-slug:
        description: 'Storefront deploy target slug (e.g. "pr-1234", "nightly", "v4"). Used as the key prefix in the origin bucket; must match the storefront basePath baked in at build time.'
        required: true
        type: string
      storefront-algolia:
        description: 'Whether to (re)index the storefront on Algolia. Resolved once in the caller (contribution.yml → context job); should be "true" only for production-ish refs (main + version branches), never PRs.'
        required: true
        type: string
    secrets:
      linode-aws-access-key-id:
        description: 'AWS Access Key ID for Linode / Akamai CDN.'
        required: true
      linode-aws-secret-access-key:
        description: 'AWS Secret Access Key for Linode / Akamai CDN.'
        required: true
      aws-storefront-preview-role-arn:
        description: 'IAM role assumed via OIDC to publish pull request previews. Confined to `pr-*` prefixes.'
        required: true
      aws-storefront-release-role-arn:
        description: 'IAM role assumed via OIDC to publish nightly and version slugs. Cannot delete outside `nightly/`.'
        required: true
      aws-storefront-bucket:
        description: 'Storefront origin bucket.'
        required: true
      aws-storefront-distribution-id:
        description: 'Storefront CloudFront distribution to invalidate.'
        required: true
      algolia-app-id:
        description: 'Algolia App ID (Storefront).'
        required: true
      algolia-api-key:
        description: 'Algolia API Key (Storefront).'
        required: true

# Least privilege: the Akamai jobs deploy via the Linode AWS secrets, and the storefront jobs via a
# short-lived OIDC token — never the workflow `GITHUB_TOKEN` — so read access is all this workflow
# needs from it. `id-token: write` is granted per job rather than here, so the Akamai jobs cannot
# mint an AWS token they have no use for.
permissions:
  contents: read

jobs:
  akamai-cdn-assets:
    name: 'Akamai CDN (Assets)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
        with:
          node_modules: 'false'
          rclone: 'true'
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - name: 'Rclone (Components)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/components/'
          target: 'components/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Crest)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/crest/'
          target: 'crest/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Flags)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/flags/'
          target: 'flags/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Fonts)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/fonts/'
          target: 'fonts/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Icons)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/icons/'
          target: 'icons/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Marque)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/marque/'
          target: 'marque/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Meta Icons)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/meta-icons/'
          target: 'meta-icons/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Model Signatures)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/model-signatures/'
          target: 'model-signatures/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
      - name: 'Rclone (Styles)'
        uses: ./.github/actions/rclone
        with:
          source: 'packages/assets/cdn/styles/'
          target: 'styles/'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.linode-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.linode-aws-secret-access-key }}
  akamai-cdn-assets-smoke:
    name: 'Akamai CDN (Assets) Smoke'
    needs:
      - akamai-cdn-assets
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - run: npm run test:smoke:components-js
      - run: npm run test:smoke:components-angular
      - run: npm run test:smoke:components-react
      - run: npm run test:smoke:components-vue
  storefront-preview:
    name: 'Storefront (Preview)'
    # Previews assume `storefront-preview-deployer`, whose OIDC trust condition is the bare
    # `repo:…/porsche-design-system:pull_request` subject. Declaring a GitHub Environment here would
    # change the token's subject to `…:environment:<name>` and the role would refuse it — the preview
    # path deliberately has no environment. The `pr-*` prefix confinement is what isolates a preview
    # from published content; there is no account boundary doing that job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Mint the OIDC token that `configure-aws-credentials` exchanges for the role
    steps:
      - uses: actions/checkout@v7
      # No `install` step on purpose: only the Algolia step needs `node_modules`, and previews never
      # index. The bin files `restore` fixes up come from the artifact, not from an install.
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - name: 'Assume AWS role'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.aws-storefront-preview-role-arn }}
          aws-region: eu-central-1
      - name: 'Deploy (S3)'
        uses: ./.github/actions/s3-deploy
        with:
          source: ./packages/storefront/dist
          # Slug is resolved once in the caller (contribution.yml → context job) and passed through,
          # so the key prefix always matches the storefront basePath baked in at build time.
          slug: ${{ inputs.storefront-slug }}
          bucket: ${{ secrets.aws-storefront-bucket }}
          distribution-id: ${{ secrets.aws-storefront-distribution-id }}
          # A preview should mirror its branch exactly, and the role may delete under `pr-*`.
          delete: 'true'
  storefront-release:
    name: 'Storefront (Release)'
    # `nightly` and the major-version aliases. The `storefront` environment is not decoration: its
    # name is the OIDC trust condition of `storefront-release-deployer`, and the branch policy on it
    # (`main`, `v[0-9]`, `v[0-9][0-9]` — mirroring `on.push.branches` in contribution.yml) is the
    # only thing standing between an arbitrary branch and that role.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: storefront
    permissions:
      contents: read
      id-token: write # Mint the OIDC token that `configure-aws-credentials` exchanges for the role
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install # `node_modules` for the Algolia indexing step
      - name: 'Restore'
        uses: ./.github/actions/restore
        with:
          artifact: 'build-production'
      - name: 'Assume AWS role'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.aws-storefront-release-role-arn }}
          aws-region: eu-central-1
      - name: 'Deploy (S3)'
        uses: ./.github/actions/s3-deploy
        with:
          source: ./packages/storefront/dist
          slug: ${{ inputs.storefront-slug }}
          bucket: ${{ secrets.aws-storefront-bucket }}
          distribution-id: ${{ secrets.aws-storefront-distribution-id }}
          # Only `nightly` is prunable, and only because the role permits it. A push to a `v*` branch
          # republishes the major-version alias without removing anything: published content is
          # append-only so that a buggy pipeline cannot unpublish a release. Orphans left behind are
          # unreachable unless something links to them directly.
          delete: ${{ inputs.storefront-slug == 'nightly' }}
          # Algolia indexing flag is also resolved once in the caller (contribution.yml → context job).
          algolia: ${{ inputs.storefront-algolia }}
        env:
          ALGOLIA_APP_ID: ${{ secrets.algolia-app-id }}
          ALGOLIA_API_KEY: ${{ secrets.algolia-api-key }}
