name: 'Code Scanning'

# ⚠️ Do NOT rename this file or the `build` job below, and do not move CodeQL into another
# workflow (e.g. `contribution.yml`), without reading this first.
#
# CodeQL derives the analysis *category* from "<workflow file path>:<job id>", here
# `.github/workflows/code-scanning.yml:build`. GitHub closes an alert only once EVERY
# category that ever reported it reports it as fixed.
#
# Renaming therefore orphans the old category: it never receives another analysis, so its
# last one is frozen and keeps reporting whatever it saw at that moment, forever. Every
# finding present at that instant can then never transition to "fixed". That is exactly
# what happened while the job was briefly named `code-ql` — four alerts survived their own
# fix (one of them for ten months) and had to be cleared by deleting the stale analyses by
# hand.
#
# To be precise about what a rename does NOT do: alert identity survives it. Alerts keep
# their number and gain instances under both categories, and dismissals are not lost — 51
# of the current dismissals predate the `code-ql` era and came through it untouched. Only
# the open/fixed transition is affected, which is why the damage is invisible until
# somebody fixes a finding and the alert refuses to close.
#
# If the job ever does need a different id, pin the category to its current value first:
#
#   - uses: github/codeql-action/analyze@v4
#     with:
#       category: '.github/workflows/code-scanning.yml:build'
#
# That decouples the category from the job id, so the rename becomes a no-op for alert
# tracking. Verify it on the pull request before merging — the run publishes an analysis
# whose category can be read back with:
#
#   gh api repos/$REPO/code-scanning/analyses?ref=refs/pull/<n>/merge --jq '.[].category'

on:
  push:
    branches:
      - main
      - 'v[0-9]'      # v0–v9
      - 'v[0-9][0-9]' # v10–v99
  # Every PR, regardless of target branch — mirrors `contribution.yml`, so PRs against the
  # maintained version branches are scanned too.
  pull_request:
  schedule:
    # Mondays 03:00 UTC. CodeQL ships new and improved queries independently of this
    # repository, so unchanged code can start failing a query that did not exist yet.
    # Without this, such findings would only surface on the next push to a covered branch.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

# Only ever cancel superseded pull_request runs. A cancelled run uploads no analysis, which
# would leave the category stale — so push, schedule and workflow_dispatch runs must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 'CodeQL'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Initialize'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - name: 'Analyze'
        uses: github/codeql-action/analyze@v4
