name: 'Code Scanning'

# ⚠️ The `category:` pin on the `analyze` step below is load-bearing. Do not remove it, and
# do not rename this file, without reading this first.
#
# CodeQL derives the analysis *category* from "<workflow file path>:<job id>" unless an
# explicit `category:` is given. GitHub closes an alert only once EVERY category that ever
# reported it reports it as fixed.
#
# A category change therefore orphans the old one: it never receives another analysis, so
# its last one is frozen and keeps reporting whatever it saw at that moment, forever. Every
# finding present at that instant can then never transition to "fixed". That is exactly what
# happened while this job was briefly named `code-ql` — four alerts survived their own fix
# (one of them for ten months) and had to be cleared by deleting the stale analyses by hand.
#
# To be precise about what a category change does NOT do: alert identity survives it. Alerts
# keep their number and gain instances under both categories, and dismissals are not lost —
# 51 of the current dismissals predate the `code-ql` era and came through it untouched. Only
# the open/fixed transition is affected, which is why the damage stays invisible until
# somebody fixes a finding and the alert refuses to close.
#
# The category is pinned to `.github/workflows/code-scanning.yml:build` — the value it was
# derived from back when this job was still called `build`. It deliberately no longer
# matches the job id: the pin is what let the job be renamed to `codeql` without orphaning
# 981 analyses and the 63 findings they still report. Keep it exactly as is; the string is
# an identifier for GitHub's alert tracking, not a description of this workflow.
#
# Renaming the job is now safe, because the pin decides the category. Changing the pin is
# not. If it ever has to change, verify on the pull request before merging — the run
# publishes an analysis whose category can be read back with:
#
#   gh api repos/$REPO/code-scanning/analyses?ref=refs/pull/<n>/merge --jq '.[].category'

on:
  push:
    branches:
      - main
      - 'v[0-9]'      # v0–v9
      - 'v[0-9][0-9]' # v10–v99
  # Every PR, regardless of target branch — mirrors `contribution.yml`, so PRs against the
  # maintained version branches are scanned too.
  pull_request:
  schedule:
    # Mondays 03:00 UTC. CodeQL ships new and improved queries independently of this
    # repository, so unchanged code can start failing a query that did not exist yet.
    # Without this, such findings would only surface on the next push to a covered branch.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

# Only ever cancel superseded pull_request runs. A cancelled run uploads no analysis, which
# would leave the category stale — so push, schedule and workflow_dispatch runs must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: 'CodeQL'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Initialize'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - name: 'Analyze'
        uses: github/codeql-action/analyze@v4
        with:
          # Pinned on purpose — see the note at the top of this file. This is the category
          # derived from the former `build` job id, kept so that renaming the job does not
          # orphan the existing analyses. It must not be changed to match the job id.
          category: '.github/workflows/code-scanning.yml:build'
