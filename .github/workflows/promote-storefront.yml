name: 'Promote Storefront'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release to promote, e.g. v4.7.0. Does not publish npm packages or send Slack messages.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  context:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      major-slug: ${{ steps.resolve.outputs.major-slug }}
    steps:
      - name: 'Validate stable release tag'
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]?)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag with a supported major (0-99), got: $TAG" >&2
            exit 1
          fi
          echo "major-slug=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
  promote:
    name: 'Promote major storefront'
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: storefront
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: storefront-major-${{ needs.context.outputs.major-slug }}
      cancel-in-progress: false
    steps:
      # Keep current automation separate from the immutable release sources.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release-source
      - name: 'Verify release version'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./release-source/packages/components/package.json').version")
          if [[ "v${version}" != "$TAG" ]]; then
            echo "Tag and source package version disagree" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
        id: version
        env:
          TAG: ${{ inputs.tag }}
      - uses: ./.github/actions/is-storefront-version-published
        id: pinned
        with:
          version: ${{ steps.version.outputs.version }}
          base-url: ${{ secrets.AWS_STOREFRONT_BASE_URL }}
      - name: 'Require pinned documentation'
        if: steps.pinned.outputs.is-published != 'true'
        run: |
          echo "Publish the pinned storefront through the release pipeline before promoting it." >&2
          exit 1
      - name: 'Assume AWS role'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_STOREFRONT_RELEASE_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: ./.github/actions/promote-major-storefront
        with:
          source-directory: release-source
          build-dependencies: 'true'
          bucket: ${{ secrets.AWS_STOREFRONT_BUCKET }}
          distribution-id: ${{ secrets.AWS_STOREFRONT_DISTRIBUTION_ID }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
